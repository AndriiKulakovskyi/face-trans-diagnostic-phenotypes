# configs/bayesian_model.yaml — V3 measurement-model engine config (config-first)
# =====================================================================================
# Drives src/v3/latent_models/bayesian. The engine reads factors, the staged build
# sequence, item sets, init, and sampler settings from here — no hard-coded model spec.
#
# WHY STAGED ITEM SETS: the marginalized Gaussian likelihood sums over EXACT observed-cell
# patterns. With the full 64-item continuous pool, patterns fragment (most patients are
# their own pattern) and `min_group` drops ~85% of them. So NUTS certifies STRUCTURE on a
# well-observed CORE (the questions: does G identify? do cross-loadings emerge? do mixed
# likelihoods integrate?), and the FULL sparse pools compete at the ADVI SCALE stage (6),
# which doesn't need pattern grouping. Every item still appears in the prior matrix and
# the adjudication; nothing is silently dropped.

version: "v3.1"
seed: 20260605

# ----- factors (continuous-block columns). G first; orthogonal to specifics. -----
general_factor: overall_severity
specific_factors: [cognition, metabolic, inflammatory, sleep, affective_internalizing]
# additional factors introduced at the scale stage (full pools / sparse proxies):
scale_factors: [mania_activation, neurodevelopment, substance]

# ----- item sets for the tractable NUTS core -----
# CORE_CONT = the certified objective-sleep core (well observed; ~23% pattern drop). This
# is the Stage-0 reproduction target and the base every NUTS stage builds on.
core_continuous:
  cognition:    [cvlt_total_recall, wais_code_std, wais_digitspan_std, verbal_fluency_semantic, tmt_b_time_sec]
  metabolic:    [bmi, wstcir, trig, gluc, hdl, sysbpsupine]
  inflammatory: [crp, wbc, neut, plat, mono_lbstresc]
  sleep:        [psqi11, psqi12, psqi14]          # objective: efficiency/duration/latency
  affective_internalizing: [madrs, qidsr120, staya, qids_anhedonia_interest]

# G continuous anchors (well-observed severity/functioning; identify G in the Gaussian block)
g_anchors_continuous: [cgi03, egf, eq5d, eq5d0206, fast, fast25, fast26, fast27, fast29]

# explicit-block items introduced at Stages 3-4 (mixed likelihoods on shared factors)
explicit:
  ordinal_g:    [cgi01, cgi02, cgi03a, cgi03b, lvsbjind]    # CGI severity on G (Stage 3)
  binary_suic:  [isf01, isf02, isf03, isf04, isf05, isf08, isf09]   # suicidality (Stage 4)
  count_suic:   [isf09a]                                    # attempt count (Stage 4)
  binary_subst: [suoccur_alcool, suoccur_cannabis]          # substance (Stage 4)
  count_g:      [nboccur_hospitalisation_lt]                # hospitalization burden on G (Stage 4)

# ----- staged build sequence (each certifies before advancing; warm-starts from prior) -----
stages:
  0:
    name: "reproduce certified core"
    include_g: false
    cross_loadings: false           # simple structure
    prior_mode: certified           # HalfNormal(0.6) loadings — match V3_RESULTS exactly
    explicit: []
    question: "does the new config-first code path reproduce the certified result?"
  1:
    name: "G + severity anchors (bifactor)"
    include_g: true
    cross_loadings: false           # specifics simple; specifics MAY load on G (bifactor)
    prior_mode: soft
    explicit: []
    question: "does a dedicated-anchor general factor identify? (the rescue)"
  2:
    name: "ESEM cross-loadings"
    include_g: true
    cross_loadings: true            # free theory-motivated plausible cross cells
    cross_tier: plausible_only      # default arm: hard-zero the ~88 unlikely (soft-zero) cells
    cross_sd_scale: 0.6             # mild tighten (ESEM ridge guard; Phi carries assoc)
    prior_mode: soft
    target_accept: 0.99             # harder geometry under free cross-loadings
    explicit: []
    question: "do the theory-motivated cross-loadings emerge, or is simple structure adequate?"
  3:
    name: "ordinal CGI on explicit Z"
    include_g: true
    cross_loadings: true
    prior_mode: soft
    explicit: [ordinal_g]
    question: "does the explicit-Z block coexist with the marginalized block?"
  4:
    name: "mixed-likelihood discrete on shared Z"
    include_g: true
    cross_loadings: true
    prior_mode: soft
    explicit: [ordinal_g, binary_suic, count_suic, binary_subst, count_g]
    question: "do binary/count indicators load on shared factors as expected?"
  5:
    name: "robustness (student-t / lognormal tails)"
    include_g: true
    cross_loadings: true
    prior_mode: soft
    explicit: [ordinal_g, binary_suic, count_suic, binary_subst, count_g]
    robust: true
    question: "are findings robust to heavy-tailed continuous likelihoods?"
  6:
    name: "scale: full pools, ADVI, full N"
    include_g: true
    cross_loadings: true
    prior_mode: soft
    full_pools: true                # use the entire prior-matrix item set
    inference: advi_fullrank        # NUTS pattern-loop intractable here
    min_group: 3
    question: "do full-pool findings agree with the NUTS core (ADVI-vs-NUTS check)?"

# ----- initialization (proper warm-start; the user's emphasis) -----
init:
  method: efa_procrustes_advi       # EFA on mean-filled COPY (init only) -> Procrustes -> ADVI
  advi_init: "advi+adapt_diag"
  n_init: 50000
  warm_start_from_prior_stage: true # load prior stage posterior means as initvals

# ----- sampler defaults (per-stage overrides allowed) -----
sampler:
  draws: 600
  tune: 800
  chains: 4
  cores: 1                          # macOS multiprocessing hang -> always 1 (non-negotiable)
  target_accept: 0.95
  min_group: 10                     # continuous-pattern grouping floor (NUTS core)
  psi_floor: 0.05                   # Heywood guard

# ----- certification gates -----
gates:
  rhat_max: 1.01
  divergences_max: 0
  ess_min: 400
  heywood_loading_cap: 2.5
