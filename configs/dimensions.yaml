# configs/dimensions.yaml — V3 modeling ontology (config-first single source of truth)
# =====================================================================================
# This file defines the LATENT FACTORS of the V3 measurement model and the FULL
# indicator pool seeded onto each. It is read directly by the soft-prior ESEM-bifactor
# engine (src/v3/latent_models/bayesian) and the prior-matrix builder
# (src/v3/priors/build_matrix.py). There is NO hard-coded SPEC anywhere in the model.
#
# Principles (enforced by tests/v3):
#   * The 10+ candidate dimensions are SOFT PRIORS, not fixed scores. The data may
#     confirm / split / merge / reject / downgrade / cross-load any of them.
#   * Diagnosis (cohort/arm) is a covariate / validation label, NEVER an indicator.
#   * No naive imputation: every indicator is modeled on its observed cells only.
#   * `is_general_factor: true` marks the candidate general factor G (overall_severity),
#     which receives DEDICATED anchors and is held orthogonal to the specific factors
#     (bifactor identification). Whether G survives is ADJUDICATED, not assumed.
#   * `model_factor: true`  -> becomes a latent factor in the measurement model.
#     `model_factor: false` -> adjudicated as covariate / proxy / historical only
#                              (kept for validation, not estimated as a latent factor).
#
# Per-item likelihood family lives in configs/likelihoods.yaml (single source).
# Prior tiers (primary / plausible_cross / unlikely) are expanded by priors.yaml rules
# into the full prior_loading_matrix. `sign: pos|neg` orients higher = more burden.

meta:
  version: "v3.1"
  visit: "V0"                      # baseline only
  cohort_balance: "subsample_500_most_complete"   # BP/SZ/DR equalized; 1/n weighting in atlas
  orientation: "higher = more burden / more severe"
  notes: >
    Initial soft ontology = 10 candidate dimensions + 4 measured extensions
    (affective_internalizing, mania_activation, substance, neurodevelopment) + the
    candidate general factor (overall_severity). Final set is the model's output.

# ---------------------------------------------------------------------------------
# GENERAL FACTOR (candidate) — dedicated anchors, held orthogonal to specifics.
# This is the rescue of the "no general factor" question: the earlier bifactor
# failed because G had NO dedicated anchors and competed with the specifics. Here G
# is built from severity/functioning indicators that load on G ONLY.
# ---------------------------------------------------------------------------------
general_factor:
  key: overall_severity
  is_general_factor: true
  model_factor: true
  role: candidate_general
  label: "Overall clinical severity / functioning (G)"
  anchors:                         # load on G only (sd~0 on every specific factor)
    pos: [cgi01, cgi02, cgi03, cgi03a, cgi03b, lvsbjind]   # CGI severity/illness
    neg: [egf, eq5d, eq5d0206, fast29]                      # functioning/QoL: higher = better -> neg
  extended:                        # functional-impairment items (FAST), higher = worse
    pos: [fast, fast25, fast26, fast27, fast28, fast30]
  count_anchors:
    pos: [nboccur_hospitalisation_lt]                       # hospitalization burden
  rationale: >
    All 3-cohort, well covered (cgi01 ~.88/.95/.95). Severity + functioning + service
    use. Held orthogonal to specifics; adjudicated as confirmed-but-weak vs not-general.

# ---------------------------------------------------------------------------------
# SPECIFIC FACTORS (the transdiagnostic dimensions). FULL seeded pools.
# ---------------------------------------------------------------------------------
factors:

  - key: cognition
    model_factor: true
    role: core
    sign: neg                       # most neuropsych scores: higher = better -> neg (burden = low score)
    primary:
      # full NEUROPSYCHOLOGIE pool (education_years excluded as covariate)
      neg: [cvlt_total_recall, cvlt_short_delay_free_recall, cvlt_long_delay_free_recall,
            wais_code_std, wais_digitspan_std, wais_ivt_index, wais_similitudes_std,
            verbal_fluency_phonemic, verbal_fluency_semantic]
      pos: [tmt_a_time_sec, tmt_b_time_sec]      # time: higher = worse -> pos burden
    plausible_cross: [overall_severity]
    subdimensions:
      cognitive_flexibility: [tmt_b_time_sec, wais_code_std, wais_ivt_index]
    rationale: "11-item full pool (was hand-picked 5/11). SZ-worst expected (validation)."

  - key: metabolic
    model_factor: true
    role: core
    sign: pos
    primary:
      pos: [bmi, wstcir, weight, chol, ldl, cholhdl_lbstresc, trig, gluc, hba1c, urate,
            sysbpsupine, sysbpstanding, diabpsupine, diabpstanding]
      neg: [hdl]                    # HDL protective: higher = better -> neg
    plausible_cross: [inflammatory]
    covariate_only: [prolctn, qtc, oxcarbaz]    # drug/ECG confounds, not indicators
    rationale: "~15-item metabolic-load core (was 6/26). Adiposity+lipids+glycemia+BP."

  - key: inflammatory
    model_factor: true
    role: core
    sign: pos
    primary:
      pos: [crp, wbc, neut, mono_lbstresc, plat]
      neg: [lym_lbstresc]           # lymphopenia direction is ambiguous; soft, adjudicate
    plausible_cross: [metabolic]
    extended:
      pos: [eos, baso_lbstresc]     # granulocyte detail; weakly informative
    rationale: "8-item innate-immune load. Split from metabolic is a key adjudication."

  - key: sleep
    model_factor: true
    role: core
    sign: pos
    primary:                        # OBJECTIVE PSQI parameters (canonical, depression-clean)
      pos: [psqi11, psqi12, psqi14]          # efficiency, duration, latency (oriented worse=pos)
    plausible_cross: [affective_internalizing, overall_severity]
    subjective_items:               # subjective PSQI: modeled but affective-cross (method overlap)
      pos: [psqi, psqi13, psqi15, psqi17]    # global, disturbance, quality, daytime-dysfunction
      cross: [affective_internalizing]
    extension_BPDR: [ess0109, csm]  # Epworth / chronotype (BP/DR)
    covariate_only: [psqi16]        # sleep-med use
    rationale: >
      Canonical sleep = objective params only: psqi11/12/14 = efficiency/duration/latency
      (per scripts/v3/06 decomposition; sleep x affective 0.68->0.54 once depression-
      overlapping subjective items psqi13/15/17 = disturbance/quality/daytime are removed).
      Subjective items kept with an affective cross-loading so the method overlap is
      modeled, not hidden. PSQI components (0-3) modeled gaussian in the continuous core
      (matches the certified model); ordinal-robustness is a Stage-3 sensitivity check.

  - key: affective_internalizing
    model_factor: true
    role: core                      # promoted: was 'extension'; symptom axis is central
    sign: pos
    primary:
      pos: [madrs, qidsr120, staya, qids_anhedonia_interest]   # depression/anxiety/anhedonia
    plausible_cross: [overall_severity, sleep]
    merges: [anhedonia]             # anhedonia merged here (qids item-13), not standalone
    coverage: "BP/DR only — SZ contributes no affective cells (observed-likelihood handles it)"
    rationale: "MADRS/QIDS/STAI + anhedonia. SZ affective score is a proxy via couplings."

  - key: mania_activation
    model_factor: true
    role: module                    # measured 3-cohort (.96/.92/.70) — was dropped w/o adjudication
    sign: pos
    primary:
      pos: [ymrs, altman]
    plausible_cross: [overall_severity]
    rationale: "YMRS + Altman. Re-instated for explicit adjudication (module/confirmed?)."

  - key: suicidality
    model_factor: true
    role: core
    sign: pos
    # MIXED LIKELIHOODS: bernoulli ideation/attempt + ordinal + count attempts.
    primary:
      pos: [isf01, isf02, isf03, isf04, isf05, isf07, isf08, isf08a, isf09, isf09a]
    plausible_cross: [affective_internalizing]
    extension_BPDR: []              # C-SSRS as DIF-aware extension later
    rationale: "Full ISF pool (was 7/34), modeled with its native mixed likelihoods."

  - key: neurodevelopment
    model_factor: true
    role: proxy                     # 3-cohort but heterogeneous; adjudicate module/proxy
    sign: pos
    primary:
      pos: [wurs, ctq29, ctq31, ctq33, ctq35, ctq37, ctq39, ctq40, ctq41]   # ADHD-childhood + trauma
    binary_anchors:
      pos: [epilepsie_mhoccur, autneuro_mhoccur, traumacra_mhoccur]
    extended:                       # perinatal section (sparse, soft)
      pos: [prembrth, naisstyp]
      neg: [apgr0106_1min, apgr0106_5min, brthht, gstabrth]
    covariate_only: [agedebutpremier_episode, agetrt, mere_suicide, pere_suicide]
    rationale: "WURS+CTQ+neuro-history+perinatal. Proxy bundle; adjudicate, don't assume."

  - key: substance
    model_factor: true
    role: module
    sign: pos
    primary:
      pos: [fagers, sudose_cigarettes_lt]            # nicotine dependence/dose
    binary_anchors:
      pos: [suoccur_alcool, suoccur_cannabis]        # lifetime SUD (BP/SZ 2-cohort)
    covariate_only: [suncf_cigarettes_lt, agedebut_cigarettes_lt]
    rationale: "Nicotine/alcohol/cannabis. Module; partly 2-cohort (observed-likelihood)."

# ---------------------------------------------------------------------------------
# UNSUPPORTED candidates — seeded by the ontology but NOT enough 3-cohort indicators
# to identify a factor. Kept here so the adjudication table records them explicitly
# (rejected/unsupported), never silently dropped.
# ---------------------------------------------------------------------------------
unsupported:
  - key: negative_symptoms
    reason: "No dedicated 3-cohort negative-symptom instrument harmonized (PANSS SZ-only)."
  - key: sensory_abnormalities
    reason: "No harmonized sensory battery across cohorts."
  - key: impulsivity
    reason: "No direct 3-cohort impulsivity scale; represented via mania/substance proxies."

# ---------------------------------------------------------------------------------
# NON-FACTOR candidates — adjudicated as historical/covariate (validation only).
# ---------------------------------------------------------------------------------
non_factor:
  - key: illness_course
    role: historical
    items: [agedebutpremier_episode, agetrt, agedebut_hospitalisation,
            nboccur_hospitalisation_lt, hodur_hospitalisation_lt]
    reason: "Course/history — validation covariates, not a latent symptom dimension."

# ---------------------------------------------------------------------------------
# Covariates / validation labels — NEVER indicators, NEVER clustering features.
# ---------------------------------------------------------------------------------
covariates: [age, sex, education_years, edulevel, siteid_city, arm, cohort, visit, visitnum, mars]
validation_labels: [cohort, arm]
