name: CI

on:
  push:
    branches: [main, v2-study]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install (core + dev)
        run: pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check .
      - name: Unit tests + golden-numbers regression
        # Confidential cohort data is absent in CI; tests use synthetic fixtures and the
        # committed aggregate result artifacts (golden-numbers tests skip if a file is missing).
        run: python -m pytest tests/ -q
