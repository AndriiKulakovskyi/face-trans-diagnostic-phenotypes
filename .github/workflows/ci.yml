name: CI

on:
  push:
    branches: [main, v2-study]
  pull_request:
  workflow_dispatch:        # allow manual re-runs from the Actions tab / gh CLI

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # 3.13 to match the dev env the lockfile was generated against: the modern modular arviz
          # (arviz==1.1.0, whose az.from_dict idata layout the GLM tests depend on) requires Python>=3.12,
          # so the pinned bayesian stack is not installable on 3.11.
          python-version: "3.13"
          cache: pip
      - name: Install (core + bayesian + strata + dev)
        # Install the Bayesian backend (pymc/pytensor/numpyro/jax/arviz) AND the M2 strata engine
        # (archetypes/diptest/hdbscan/umap/networkx) so the measurement + stratification golden tests are
        # actually exercised in CI. requirements.lock pins the EXACT tested versions (regenerate with
        # scripts/gen_lockfile.py) and is applied as a constraint so CI runs the same versions as local;
        # ranges live in pyproject [bayesian]/[strata].
        run: pip install -e ".[bayesian,strata,dev]" -c requirements.lock
      - name: Lint (ruff)
        run: ruff check .
      - name: Unit tests + golden numerical-kernel regression
        # Confidential cohort data is absent in CI; tests use synthetic fixtures (tests/golden exercises
        # the Woodbury likelihood / conditional scoring / hurdle on synthetic data) and committed aggregate
        # artifacts (golden-numbers tests skip if a file is missing).
        run: python -m pytest tests/ -q
