[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "face"
version = "0.1.0"
description = "FACE precision psychiatry (BP/SZ/DR): harmonized 3-cohort data → patient-level, missingness-aware transdiagnostic dimension discovery → validated probabilistic strata → temporal coherence → prognosis → treatment. Milestones 1–5 complete (pending PI sign-off); see docs/STATE.md."
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "pydantic>=2.5",      # feature-schema models
    "pyyaml>=6.0",
    "openpyxl>=3.1",      # read the common-variables dictionary (.xlsx)
    "statsmodels>=0.14",  # nested F-test / LRT in the outcome head-to-head
    "factor_analyzer>=0.5",  # EFA warm-start init for the Bayesian measurement engine
    "plotly>=5.18",       # interactive HTML reports
    "matplotlib>=3.7",    # static figures (prior atlas, stage reports)
    "pyarrow>=14",        # Parquet persistence for data/processed/*.parquet
]

[project.optional-dependencies]
figures = ["kaleido>=0.2"]                            # static export of plotly figures
dev = ["pytest>=7.0", "pytest-cov>=4.0", "ruff==0.12.0", "pip-tools>=7.0"]  # ruff pinned: lint rules change between versions (keep CI == local)
# Bayesian measurement engine (face.measurement): patient-level observed-likelihood latent model.
# numpyro+jax provide the NUTS backend; on a CUDA box also `pip install -U "jax[cuda12]"` for GPU.
bayesian = ["pymc>=5.10", "arviz>=0.17", "h5netcdf>=1.0", "numpyro>=0.13", "jax>=0.4"]
# M2 stratification engine: archetypal analysis (PCHA), Hartigan dip test, density clustering +
# mapper-graph topology for the structure gate. Pinned exactly in requirements.lock.
strata = ["archetypes>=0.12", "diptest>=0.11", "hdbscan>=0.8.40", "umap-learn>=0.5.7", "networkx>=3.0"]
# Variational GLLVM atlas engine (analyses/variational_gllvm): a PyTorch SVI re-estimation of the
# M1 measurement model (exploration/acceleration arm), separated from the core package so the
# installed `face` wheel and the core golden tests never import torch.
variational = ["torch>=2.2"]
# Convenience alias for "everything needed to export static figures".
full = ["kaleido>=0.2"]

[tool.hatch.build.targets.wheel]
packages = ["src/face"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# importlib mode: milestone test dirs have no __init__.py, so same-basename modules
# (e.g. tests/prognosis/test_endpoints.py + tests/treatment/test_endpoints.py) must not collide.
addopts = "--import-mode=importlib"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Pyflakes (real bugs / unused imports) + import order + modernization + bugbear.
select = ["E", "F", "W", "I", "UP", "B"]
# Ignored on purpose: E501 long lines (inline CSS / dense docstrings), E701/E702 compact
# one-liners, E731 small lambdas (path/colour helpers), E741 single-letter math names (L, l),
# F601 harmless dup-coercion keys in rules.py (1/1.0/True all map to the same value), F841
# throwaway locals in scripts, B006/7/8/23 call-in-default + B905 zip-without-strict (used
# deliberately). UP031/UP038 keep the existing %-format + isinstance-tuple style. E402:
# scripts insert src/ on sys.path before importing `face`, so their imports are not at top.
ignore = ["E501", "E701", "E702", "E731", "E741", "F601", "F841",
          "B006", "B007", "B008", "B023", "B905", "UP031", "UP038", "E402"]
