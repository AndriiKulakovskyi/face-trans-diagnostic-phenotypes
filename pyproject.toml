[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "trans-diag"
version = "0.1.0"
description = "FACE trans-diagnostic phenotyping (BP/SZ/DR): longitudinal harmonization + a confound-controlled dimensional model. Self-contained — the stratification engine is internalized in trans_diag.engine."
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "pydantic>=2.5",      # feature-schema models
    "pyyaml>=6.0",
    "openpyxl>=3.1",      # read the common-variables dictionary (.xlsx)
    "statsmodels>=0.14",  # nested F-test / LRT in the outcome head-to-head
    "factor_analyzer>=0.5",  # oblique rotation + factor correlations for the hierarchical-FA pipeline (scripts 30-34_v2)
    "plotly>=5.18",       # interactive HTML reports
    "matplotlib>=3.7",    # static manuscript figures
]

[project.optional-dependencies]
figures = ["kaleido>=0.2"]                            # static export of plotly figures
dev = ["pytest>=7.0", "pytest-cov>=4.0", "ruff==0.12.0", "pip-tools>=7.0"]  # ruff pinned: lint rules change between versions (keep CI == local)
# Convenience alias for "everything needed to reproduce the manuscript + figures".
full = ["kaleido>=0.2"]

[tool.hatch.build.targets.wheel]
packages = ["src/trans_diag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Pyflakes (real bugs / unused imports) + import order + modernization + bugbear.
select = ["E", "F", "W", "I", "UP", "B"]
# Ignored on purpose: E501 long lines (inline CSS / dense docstrings), E702 compact
# one-liners, E741 single-letter math names (L, l), F601 harmless dup-coercion keys in
# rules.py (1/1.0/True all map to the same value), F841 throwaway locals in scripts,
# B008 (call-in-default used deliberately). E402: scripts insert src/ on sys.path
# before importing trans_diag, so their imports are intentionally not at module top.
ignore = ["E501", "E702", "E741", "F601", "F841", "B006", "B007", "B008", "B023", "E402"]
