[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "face-common"
version = "0.1.0"
description = "FACE trans-diagnostic phenotyping (BP/SZ/DR): longitudinal harmonization + a confound-controlled dimensional model. Self-contained — the stratification engine is internalized in face_common.engine."
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "pydantic>=2.5",      # feature-schema models
    "pyyaml>=6.0",
    "openpyxl>=3.1",      # read the common-variables dictionary (.xlsx)
    "statsmodels>=0.14",  # nested F-test / LRT in the outcome head-to-head
    "plotly>=5.18",       # interactive HTML reports
    "matplotlib>=3.7",    # static manuscript figures
]

[project.optional-dependencies]
# Heavy / specialized extras, each used by one part of the pipeline.
ai = ["torch>=2.2"]                                   # masked autoencoder (dimensional_ae.py)
combat = ["neuroHarmonize>=2.4", "neuroCombat>=0.2.12", "nibabel>=5.0"]  # site harmonization (robustness_site.py)
figures = ["kaleido>=0.2"]                            # static export of plotly figures
dev = ["pytest>=7.0", "pytest-cov>=4.0"]
# Convenience: everything needed to reproduce every manuscript number/figure.
full = ["torch>=2.2", "neuroHarmonize>=2.4", "neuroCombat>=0.2.12", "nibabel>=5.0", "kaleido>=0.2"]

[tool.hatch.build.targets.wheel]
packages = ["src/face_common"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
