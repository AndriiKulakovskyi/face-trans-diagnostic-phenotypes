# Complete CSV extraction layout for the SZ (Schizophrenia) cohort.
$schema_version: 1

patient_id_column: usubjid_patients

demographics:
  age: age
  sex: sex
  site_id: siteid
  arm: arm
  marital_status: maristat
  education_level: edulevel
  employment: empjob

vitals:
  bmi: bmi
  weight_kg: weight
  height_cm: height
  waist_cm: wstcir
  sbp_supine: sysbpsupine
  dbp_supine: diabpsupine

ecg:
  qtc: qtc

# ─── SZ-specific: psychotic history ─────────────────────────────────────────
psychotic_history:
  has_psychotic_disorder: psychotic
  n_psychotic_episodes: psychotic_nb
  age_onset_sz: agedebutca
  age_onset_mood: agedebutthy
  symptom_evolution_mode: modesymptomeevo
  n_psychotic_episodes_lifetime: evnum_tbpsy_lt
  n_suicide_events_last_year: evnum_suicid_ly

# ─── SZ-specific: current psychotic symptoms (ceoccur* flags) ───────────────
psychotic_symptoms:
  hallucinations_auditory: ceoccurhallusenso
  hallucinations_visual: ceoccurhalluvisu
  hallucinations_somatic: ceoccurhallucenesthe
  hallucinations_intrapsychic: ceoccurhalluintrapsy
  delusions_persecution: ceoccurpersecution
  delusions_reference: ceoccuridreferences
  delusions_grandiosity: ceoccurgrandeur
  delusions_erotomanic: ceoccurerotomaniaque
  delusions_jealousy: ceoccurjalousie
  delusions_mystical: ceoccurmystique
  delusions_somatic: ceoccursomatique
  thought_control: ceoccuretrecontrole
  thought_broadcasting: ceoccurvolpensee
  disorganized_speech: ceoccurdiscdesorg
  disorganized_behavior: ceoccurcompodesorg
  bizarre_behavior: ceoccurbizarre
  avolition: ceoccuravolition
  alogia: ceoccuralogie
  catatonia: ceoccurcatatonie

# ─── SZ-specific: insight (SUMD items 1-9) ──────────────────────────────────
insight:
  awareness_of_illness: sumd01
  awareness_of_medication_effect: sumd02
  awareness_of_social_consequences: sumd03
  awareness_of_hallucinations: sumd04a
  awareness_of_delusions: sumd05a
  awareness_of_thought_disorder: sumd06a
  awareness_of_flat_affect: sumd07a
  awareness_of_anhedonia: sumd08a
  awareness_of_asociality: sumd09a

# ─── Cognitive profile ─────────────────────────────────────────────────────
cognitive_profile:
  # SZ has both tmta01_ and tmt0101 fallbacks; list primary first
  tmt_a_seconds: tmta01_
  tmt_a_seconds_alt: tmt0101
  tmt_b_seconds: tmtb01_
  tmt_b_seconds_alt: tmt0102
  stroop_interference: strooi01_
  cvlt_total_learning: cvlt05_
  cvlt_long_delay_free: cvlt09_
  cvlt_recognition: cvlt11_
  phonemic_fluency: fv01_
  wais_similarities_std: similstd_wais4
  wais_similarities_std_alt: similstd_wais3
  wais_vocabulary_std: vocabstd_wais3
  cobra_instrument_key: COBRA

additional_neuropsych:
  matrices_raw: mat_tot_w
  matrices_std: mat_std_w
  code_raw: code03_w
  code_std: code04_w
  digit_span_forward_total: msdtot_
  digit_span_forward_std: msdstd_
  digit_span_backward_total: msitot_
  digit_span_backward_std: msistd_
  digit_span_total_raw: mstbrut_
  digit_span_total_std: mststd_

# ─── SZ-specific treatments ─────────────────────────────────────────────────
treatments:
  clozapine_plasma: clozapin
  clozapine_flag: rad_clozapine
  n_antipsychotics: psychotic_nb
  n_anticholinergics: antichol_nb
  n_anxiolytics: anxiolyt_nb
  n_hypnotics: hypnot_nb
  n_mood_stabilizers: thymoreg_nb
  n_antidepressants: depress_nb
  adherence_instrument_key: MARS

substance_use:
  tobacco: suoccur_cigarettes_lt
  alcohol: suoccur_alcool
  alcohol_type: type_alcool
  cannabis: suoccur_cannabis
  substance_use_disorder: rad_tb_subst
  other_substances:
    cocaine: suoccur_cocaine
    opiaces: suoccur_opiaces
    stimulants: suoccur_stimulants
    sedatif: suoccur_sedatif
    hallucinogenes: suoccur_hallucinogenes

family_history:
  maternal_psychiatric: mere_trouble
  paternal_psychiatric: pere_trouble
  maternal_substance: mere_substance
  paternal_substance: pere_substance
  maternal_suicide: mere_suicide
  paternal_suicide: pere_suicide
  bipolar_keyword: bipolaire
  relatives:
    - {key: gmmaternel, label_fr: "Grand-mère maternelle"}
    - {key: gpmaternel, label_fr: "Grand-père maternel"}
    - {key: gmpaternel, label_fr: "Grand-mère paternelle"}
    - {key: gppaternel, label_fr: "Grand-père paternel"}
  relative_suffixes:
    psychiatric_disorder: _trouble
    structure: _structure
    suicide: _suicide
    substance_use: _substance
    anxiety: _anx
    dementia: _dem
  siblings:
    - {key: frere1, label_fr: "Frère"}
    - {key: soeur1, label_fr: "Sœur"}
  brothers_count_col: frere_structure
  sisters_count_col: soeur_structure
  brothers_affected_col: frere_structureatteint
  sisters_affected_col: soeur_structureatteint
  sons_count_col: fils_structure
  daughters_count_col: fille_structure
  sons_affected_col: fils_structureatteint
  daughters_affected_col: fille_structureatteint

suicide_history:
  ever_felt_life_not_worth: isf01
  ever_wished_dead: isf02
  ever_thought_suicide: isf03
  ever_planned_suicide: isf04
  ever_attempted: isf05
  n_attempts: isf07
  has_violent_attempts: isf08
  n_violent_attempts: isf08a
  has_serious_attempts: isf09
  n_serious_attempts: isf09a
  most_serious_method: ltsg01
  most_violent_method: ltsv01
  most_serious_trigger: ltsg08

suicide_indicators:
  madrs_item10: madrs10
  madrs_elevated_threshold: 3
  lifetime_attempts: ltsg
  lifetime_self_harm: ltsv

hospitalization:
  n_lifetime: nboccur_hospitalisation_lt
  n_last_year: nboccur_hospitalisationtc_ly
  duration_last: hodur_hospitalisation_lt
  work_absences_flag: hooccur_arret_travail_ly

comorbidities:
  somatic_suffix: _mhoccur
  somatic:
    - {col: diabete1_mhoccur,    label_fr: "Diabète type 1"}
    - {col: diabete2_mhoccur,    label_fr: "Diabète type 2"}
    - {col: hta_mhoccur,         label_fr: "Hypertension artérielle"}
    - {col: dyslipidemie_mhoccur, label_fr: "Dyslipidémie"}
    - {col: dysthyro_mhoccur,    label_fr: "Dysthyroïdie"}
    - {col: coronar_mhoccur,     label_fr: "Coronaropathie"}
    - {col: infarctus_mhoccur,   label_fr: "Infarctus du myocarde"}
    - {col: avc_mhoccur,         label_fr: "AVC"}
    - {col: epilepsie_mhoccur,   label_fr: "Épilepsie"}
    - {col: asthme_mhoccur,      label_fr: "Asthme"}
    - {col: cirrhose_mhoccur,    label_fr: "Cirrhose"}
    - {col: neoplasi_mhoccur,    label_fr: "Néoplasie"}
    - {col: psoriasis_mhoccur,   label_fr: "Psoriasis"}
    - {col: lupus_mhoccur,       label_fr: "Lupus"}
    - {col: sep_mhoccur,         label_fr: "Sclérose en plaques"}
    - {col: migraine_mhoccur,    label_fr: "Migraine"}
    - {col: trbrycard_mhoccur,   label_fr: "Troubles du rythme cardiaque"}
    - {col: crohn_mhoccur,       label_fr: "Maladie de Crohn"}
    - {col: rhumart_mhoccur,     label_fr: "Polyarthrite rhumatoïde"}
  psychiatric:
    - {col: ceoccuranxietegeneral,  label_fr: "Trouble anxieux généralisé"}
    - {col: ceoccurphobiesoc,       label_fr: "Phobie sociale"}
    - {col: ceoccurphobie_specifique, label_fr: "Phobie spécifique"}
    - {col: ceoccurtoc,             label_fr: "TOC"}
    - {col: ceoccurspt,             label_fr: "TSPT"}
    - {col: ceoccurtca,             label_fr: "TCA"}
    - {col: ceoccurtdah,            label_fr: "TDAH"}
