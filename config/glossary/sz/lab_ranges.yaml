$schema_version: 1
labs:
- csv_col: gluc
  name: Glucose
  name_fr: Glycémie à jeun
  unit: mmol/L
  normal_range:
  - 3.9
  - 5.5
- csv_col: hba1c
  name: HbA1c
  name_fr: Hémoglobine glyquée
  unit: '%'
  normal_range:
  - 4.0
  - 5.6
- csv_col: chol
  name: Total cholesterol
  name_fr: Cholestérol total
  unit: mmol/L
  normal_range:
  - 0.0
  - 5.2
- csv_col: hdl
  name: HDL
  name_fr: HDL-cholestérol
  unit: mmol/L
  normal_range:
  - 1.0
  - 99.0
- csv_col: ldl
  name: LDL
  name_fr: LDL-cholestérol
  unit: mmol/L
  normal_range:
  - 0.0
  - 3.4
- csv_col: trig
  name: Triglycerides
  name_fr: Triglycérides
  unit: mmol/L
  normal_range:
  - 0.0
  - 1.7
- csv_col: tsh
  name: TSH
  name_fr: TSH
  unit: mUI/L
  normal_range:
  - 0.4
  - 4.0
- csv_col: creat
  name: Creatinine
  name_fr: Créatinine
  unit: µmol/L
  normal_range:
  - 60.0
  - 110.0
