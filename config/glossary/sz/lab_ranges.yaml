- csv_col: egf
  name: eGFR
  name_fr: DFG estimé
  unit: mL/min
  normal_range:
  - 90.0
  - 999.0
- csv_col: prolctn
  name: Prolactin
  name_fr: Prolactine
  unit: ng/mL
  normal_range:
  - 2.0
  - 25.0
- csv_col: crp
  name: CRP
  name_fr: Protéine C réactive
  unit: mg/L
  normal_range:
  - 0.0
  - 5.0
- csv_col: hgb
  name: Hemoglobin
  name_fr: Hémoglobine
  unit: g/dL
  normal_range:
  - 12.0
  - 17.0
  sex_specific: true
- csv_col: wbc
  name: WBC
  name_fr: Leucocytes
  unit: G/L
  normal_range:
  - 4.0
  - 10.0
- csv_col: plat
  name: Platelets
  name_fr: Plaquettes
  unit: G/L
  normal_range:
  - 150.0
  - 400.0
- csv_col: urate
  name: Uric acid
  name_fr: Acide urique
  unit: µmol/L
  normal_range:
  - 150.0
  - 420.0
  sex_specific: true
