$schema_version: 1
QIDS:
  name: QIDS
  full_name: Quick Inventory of Depressive Symptomatology — Self-Report 16
  full_name_fr: Inventaire rapide de la symptomatologie depressive — auto-evaluation
  domain: depression_self_report
  total_column: qids_
  score_range:
  - 0
  - 27
  higher_is_worse: true
  evaluation_type: auto
  clinical_note_fr: Auto-questionnaire de depression (16 items), mesure complementaire a la MADRS hetero-evaluee.
  severity_thresholds:
  - min_score: 0
    max_score: 5
    code: normal
    label_fr: Pas de depression
    clinical_meaning_fr: Absence de symptomatologie depressive significative a l'auto-evaluation.
  - min_score: 6
    max_score: 10
    code: mild
    label_fr: Depression legere
    clinical_meaning_fr: Symptomes depressifs legers rapportes par le patient ; concordance avec la MADRS a verifier.
  - min_score: 11
    max_score: 15
    code: moderate
    label_fr: Depression moderee
    clinical_meaning_fr: Symptomes depressifs moderes a l'auto-evaluation, justifiant une prise en charge active.
  - min_score: 16
    max_score: 20
    code: severe
    label_fr: Depression severe
    clinical_meaning_fr: Symptomes depressifs severes rapportes par le patient, avec retentissement fonctionnel probable.
  - min_score: 21
    max_score: 27
    code: very_severe
    label_fr: Depression tres severe
    clinical_meaning_fr: Symptomes depressifs tres severes a l'auto-evaluation, necessitant une reevaluation urgente du traitement.
ERD:
  name: ERD
  full_name: Echelle de Ralentissement Depressif
  full_name_fr: Echelle de ralentissement depressif de Widlocher
  domain: psychomotor_retardation
  total_column: erd_
  score_range:
  - 0
  - 60
  higher_is_worse: true
  evaluation_type: hetero
  clinical_note_fr: Hetero-evaluation du ralentissement psychomoteur dans la depression (14 items).
  severity_thresholds:
  - min_score: 0
    max_score: 14
    code: normal
    label_fr: Pas de ralentissement depressif
    clinical_meaning_fr: Pas de ralentissement psychomoteur significatif.
  - min_score: 15
    max_score: 24
    code: mild
    label_fr: Ralentissement leger
    clinical_meaning_fr: Ralentissement psychomoteur leger, compatible avec une depression d'intensite legere.
  - min_score: 25
    max_score: 39
    code: moderate
    label_fr: Ralentissement modere
    clinical_meaning_fr: Ralentissement psychomoteur modere, retentissement fonctionnel notable.
  - min_score: 40
    max_score: 60
    code: severe
    label_fr: Ralentissement severe
    clinical_meaning_fr: Ralentissement psychomoteur severe, retentissement fonctionnel majeur.
SHAPS:
  name: SHAPS
  full_name: Snaith-Hamilton Pleasure Scale
  full_name_fr: Echelle de plaisir de Snaith-Hamilton
  domain: anhedonia
  total_column: shaps_
  score_range:
  - 0
  - 14
  higher_is_worse: true
  evaluation_type: auto
  clinical_note_fr: Auto-questionnaire evaluant la capacite hedonique (14 items, seuil >= 3).
  screening_threshold: 3
  screening_positive_label_fr: Anhedonie significative
  screening_negative_label_fr: Pas d'anhedonie significative
Altman:
  name: ASRM
  full_name: Altman Self-Rating Mania Scale
  full_name_fr: Échelle d'auto-évaluation de la manie d'Altman
  domain: mania_self_report
  total_column: altman_
  score_range:
  - 0.0
  - 20.0
  higher_is_worse: true
  evaluation_type: auto
  clinical_note_fr: Auto-questionnaire de dépistage de l'hypomanie/manie (seuil >= 6).
  screening_threshold: 6.0
  screening_positive_label_fr: Dépistage positif d'hypomanie/manie
  screening_negative_label_fr: Dépistage négatif d'hypomanie/manie
LEAPS:
  name: LEAPS
  full_name: Lam Employment Absence and Productivity Scale
  full_name_fr: Echelle de retentissement professionnel de Lam
  domain: occupational_functioning
  total_column: leaps_
  score_range:
  - 0
  - 24
  higher_is_worse: true
  evaluation_type: auto
  clinical_note_fr: Auto-questionnaire evaluant le retentissement de la depression sur le fonctionnement professionnel.
  severity_thresholds:
  - min_score: 0
    max_score: 5
    code: minimal
    label_fr: Retentissement professionnel minimal
    clinical_meaning_fr: Retentissement professionnel minimal, fonctionnement au travail preserve.
  - min_score: 6
    max_score: 12
    code: moderate
    label_fr: Retentissement professionnel modere
    clinical_meaning_fr: Retentissement professionnel modere, difficultes au travail significatives.
  - min_score: 13
    max_score: 24
    code: severe
    label_fr: Retentissement professionnel severe
    clinical_meaning_fr: Retentissement professionnel severe, arrets de travail probables, productivite fortement reduite.
EGF:
  name: EGF
  full_name: Global Assessment of Functioning
  full_name_fr: Évaluation globale du fonctionnement
  domain: global_functioning
  total_column: egf_
  score_range:
  - 0
  - 100
  higher_is_worse: false
  evaluation_type: hetero
  clinical_note_fr: Évaluation clinique globale du fonctionnement psychologique, social et professionnel (axe V du DSM-IV-TR).
  severity_thresholds:
  - min_score: 91
    max_score: 100
    code: superior
    label_fr: Fonctionnement supérieur
    clinical_meaning_fr: Fonctionnement supérieur dans une grande variété d'activités.
  - min_score: 81
    max_score: 90
    code: absent_minimal
    label_fr: Symptômes absents ou minimaux
    clinical_meaning_fr: Symptômes absents ou minimaux, bon fonctionnement dans tous les domaines.
  - min_score: 71
    max_score: 80
    code: slight
    label_fr: Symptômes transitoires et attendus
    clinical_meaning_fr: Symptômes transitoires, léger retentissement sur le fonctionnement social ou professionnel.
  - min_score: 61
    max_score: 70
    code: mild
    label_fr: Symptômes légers
    clinical_meaning_fr: Symptômes légers avec retentissement léger sur le fonctionnement.
  - min_score: 51
    max_score: 60
    code: moderate
    label_fr: Symptômes modérés
    clinical_meaning_fr: Symptômes modérés ou difficultés modérées du fonctionnement social ou professionnel.
  - min_score: 41
    max_score: 50
    code: serious
    label_fr: Symptômes graves
    clinical_meaning_fr: Symptômes graves ou altération grave du fonctionnement social ou professionnel.
  - min_score: 31
    max_score: 40
    code: major_impairment
    label_fr: Altération majeure
    clinical_meaning_fr: Altération majeure dans plusieurs domaines (travail, relations, jugement, pensée, humeur).
  - min_score: 21
    max_score: 30
    code: serious_impairment
    label_fr: Altération sérieuse
    clinical_meaning_fr: Comportement influencé par des idées délirantes ou des hallucinations, altération sérieuse de la communication ou du jugement.
  - min_score: 11
    max_score: 20
    code: some_danger
    label_fr: Danger potentiel
    clinical_meaning_fr: Danger potentiel de blessure envers soi-même ou autrui, ou incapacité à maintenir l'hygiène personnelle.
  - min_score: 1
    max_score: 10
    code: persistent_danger
    label_fr: Danger persistant
    clinical_meaning_fr: Danger persistant de blessure sévère envers soi-même ou autrui.
BAS:
  name: BAS
  full_name: Brief Anxiety Scale
  full_name_fr: Echelle breve d'anxiete
  domain: anxiety_hetero
  total_column: bas_
  score_range:
  - 0
  - 52
  higher_is_worse: true
  evaluation_type: hetero
  clinical_note_fr: Hetero-evaluation de la severite de l'anxiete.
  severity_thresholds:
  - min_score: 0
    max_score: 9
    code: none
    label_fr: Pas d'anxiete significative
    clinical_meaning_fr: Pas d'anxiete cliniquement significative.
  - min_score: 10
    max_score: 18
    code: mild
    label_fr: Anxiete legere
    clinical_meaning_fr: Anxiete legere, ne necessitant pas necessairement de traitement specifique.
  - min_score: 19
    max_score: 29
    code: moderate
    label_fr: Anxiete moderee
    clinical_meaning_fr: Anxiete moderee, justifiant une prise en charge therapeutique.
  - min_score: 30
    max_score: 52
    code: severe
    label_fr: Anxiete severe
    clinical_meaning_fr: Anxiete severe, retentissement fonctionnel important, traitement anxiolytique a envisager.
SPIN:
  name: SPIN
  full_name: Social Phobia Inventory
  full_name_fr: Inventaire de phobie sociale
  domain: social_phobia
  total_column: spin_
  score_range:
  - 0
  - 68
  higher_is_worse: true
  evaluation_type: auto
  clinical_note_fr: Auto-questionnaire evaluant la severite de la phobie sociale (17 items).
  severity_thresholds:
  - min_score: 0
    max_score: 20
    code: none
    label_fr: Pas de phobie sociale
    clinical_meaning_fr: Pas de symptomes de phobie sociale cliniquement significatifs.
  - min_score: 21
    max_score: 30
    code: mild
    label_fr: Phobie sociale legere
    clinical_meaning_fr: Symptomes de phobie sociale legers.
  - min_score: 31
    max_score: 40
    code: moderate
    label_fr: Phobie sociale moderee
    clinical_meaning_fr: Phobie sociale moderee, retentissement fonctionnel notable.
  - min_score: 41
    max_score: 50
    code: severe
    label_fr: Phobie sociale severe
    clinical_meaning_fr: Phobie sociale severe, retentissement fonctionnel important.
  - min_score: 51
    max_score: 68
    code: very_severe
    label_fr: Phobie sociale tres severe
    clinical_meaning_fr: Phobie sociale tres severe, retentissement fonctionnel majeur, prise en charge specialisee recommandee.
PCL-5:
  name: PCL-5
  full_name: PTSD Checklist for DSM-5
  full_name_fr: Liste de vérification du TSPT pour le DSM-5
  domain: ptsd
  total_column: ptsd_
  score_range:
  - 0
  - 80
  higher_is_worse: true
  evaluation_type: auto
  clinical_note_fr: Auto-questionnaire de dépistage du TSPT (20 items, seuil ≥ 33 pour le DSM-5).
  severity_thresholds:
  - min_score: 0
    max_score: 19
    code: minimal
    label_fr: Symptômes de TSPT minimaux
    clinical_meaning_fr: Symptômes de stress post-traumatique minimaux, sous le seuil clinique.
  - min_score: 20
    max_score: 32
    code: subthreshold
    label_fr: Symptômes de TSPT sous-seuil
    clinical_meaning_fr: Symptômes de stress post-traumatique présents mais sous le seuil diagnostique.
  - min_score: 33
    max_score: 50
    code: probable
    label_fr: TSPT probable
    clinical_meaning_fr: Score au-dessus du seuil clinique (≥ 33), TSPT probable nécessitant une évaluation diagnostique approfondie.
  - min_score: 51
    max_score: 80
    code: severe
    label_fr: TSPT sévère
    clinical_meaning_fr: Symptômes sévères de stress post-traumatique, prise en charge spécialisée urgente recommandée.
  screening_threshold: 33
  screening_positive_label_fr: Dépistage positif de TSPT
  screening_negative_label_fr: Dépistage négatif de TSPT
Fagerstrom:
  name: Fagerström
  full_name: Fagerström Test for Nicotine Dependence
  full_name_fr: Test de Fagerström de dépendance à la nicotine
  domain: nicotine_dependence
  total_column: fagers
  score_range:
  - 0.0
  - 10.0
  higher_is_worse: true
  evaluation_type: auto
  clinical_note_fr: Auto-questionnaire évaluant le degré de dépendance à la nicotine.
  severity_thresholds:
  - min_score: 0.0
    max_score: 2.0
    code: low
    label_fr: Dépendance faible
    clinical_meaning_fr: Dépendance à la nicotine faible ou absente.
  - min_score: 3.0
    max_score: 4.0
    code: moderate_low
    label_fr: Dépendance modérée basse
    clinical_meaning_fr: Dépendance à la nicotine modérée basse. Un soutien au sevrage pourrait être bénéfique.
  - min_score: 5.0
    max_score: 6.0
    code: moderate
    label_fr: Dépendance modérée
    clinical_meaning_fr: Dépendance à la nicotine modérée. Substitution nicotinique recommandée en cas de tentative de sevrage.
  - min_score: 7.0
    max_score: 8.0
    code: high
    label_fr: Dépendance forte
    clinical_meaning_fr: Forte dépendance à la nicotine. Traitement pharmacologique du sevrage à envisager.
  - min_score: 9.0
    max_score: 10.0
    code: very_high
    label_fr: Dépendance très forte
    clinical_meaning_fr: Dépendance très forte à la nicotine. Prise en charge addictologique spécialisée recommandée.
EQ-VAS:
  name: EQ-VAS
  full_name: EuroQol Visual Analogue Scale
  full_name_fr: Échelle visuelle analogique EuroQol
  domain: quality_of_life
  total_column: eq5d06
  score_range:
  - 0
  - 100
  higher_is_worse: false
  evaluation_type: auto
  clinical_note_fr: Auto-évaluation de l'état de santé global sur une échelle de 0 (pire) à 100 (meilleur).
  severity_thresholds:
  - min_score: 0
    max_score: 24
    code: very_poor
    label_fr: Qualité de vie très mauvaise
    clinical_meaning_fr: État de santé perçu comme très mauvais.
  - min_score: 25
    max_score: 49
    code: poor
    label_fr: Qualité de vie mauvaise
    clinical_meaning_fr: État de santé perçu comme mauvais, retentissement fonctionnel important.
  - min_score: 50
    max_score: 74
    code: moderate
    label_fr: Qualité de vie modérée
    clinical_meaning_fr: État de santé perçu comme modéré.
  - min_score: 75
    max_score: 100
    code: good
    label_fr: Bonne qualité de vie
    clinical_meaning_fr: État de santé perçu comme bon à excellent.
ESS:
  name: ESS
  full_name: Epworth Sleepiness Scale
  full_name_fr: Échelle de somnolence d'Epworth
  domain: daytime_sleepiness
  total_column: ess
  score_range:
  - 0
  - 24
  higher_is_worse: true
  evaluation_type: auto
  clinical_note_fr: Auto-questionnaire évaluant la somnolence diurne excessive (8 situations, seuil ≥ 11).
  severity_thresholds:
  - min_score: 0
    max_score: 5
    code: normal
    label_fr: Somnolence normale
    clinical_meaning_fr: Somnolence diurne dans les limites de la normale.
  - min_score: 6
    max_score: 10
    code: mild
    label_fr: Somnolence diurne légère
    clinical_meaning_fr: Somnolence diurne légèrement augmentée.
  - min_score: 11
    max_score: 15
    code: moderate
    label_fr: Somnolence diurne modérée
    clinical_meaning_fr: Somnolence diurne modérée, retentissement fonctionnel probable.
  - min_score: 16
    max_score: 24
    code: severe
    label_fr: Somnolence diurne sévère
    clinical_meaning_fr: Somnolence diurne sévère, rechercher un syndrome d'apnées du sommeil ou une hypersomnie.
Rosenberg:
  name: Rosenberg
  full_name: Rosenberg Self-Esteem Scale
  full_name_fr: Échelle d'estime de soi de Rosenberg
  domain: self_esteem
  total_column: rosenb
  score_range:
  - 10
  - 40
  higher_is_worse: false
  evaluation_type: auto
  clinical_note_fr: Auto-questionnaire d'estime de soi (10 items, score 10-40, plus élevé = meilleur).
  severity_thresholds:
  - min_score: 10
    max_score: 19
    code: very_low
    label_fr: Estime de soi très basse
    clinical_meaning_fr: Estime de soi très basse, facteur de vulnérabilité dépressive majeur.
  - min_score: 20
    max_score: 24
    code: low
    label_fr: Estime de soi basse
    clinical_meaning_fr: Estime de soi basse, retentissement probable sur la symptomatologie dépressive.
  - min_score: 25
    max_score: 30
    code: average
    label_fr: Estime de soi moyenne
    clinical_meaning_fr: Estime de soi dans la moyenne.
  - min_score: 31
    max_score: 40
    code: high
    label_fr: Estime de soi élevée
    clinical_meaning_fr: Bonne estime de soi, facteur de protection.
BFI:
  name: BFI
  full_name: Big Five Inventory
  full_name_fr: Inventaire des cinq grands facteurs de personnalité
  domain: personality
  total_column: bfi_extr
  score_range:
  - 1
  - 5
  higher_is_worse: true
  evaluation_type: auto
  clinical_note_fr: Auto-questionnaire de personnalité (45 items, 5 dimensions, scores moyens 1-5).
  subscale_columns:
    Agréabilité: bfi_agre
    Conscienciosité: bfi_cons
    Névrosisme: bfi_emo
    Extraversion: bfi_extr
    Ouverture: bfi_ouve
BIS-10:
  name: BIS-10
  full_name: Barratt Impulsiveness Scale - version 10
  full_name_fr: Échelle d'impulsivité de Barratt (BIS-10)
  domain: impulsivity
  total_column: bis10
  score_range:
  - 30
  - 120
  higher_is_worse: true
  evaluation_type: auto
  clinical_note_fr: Auto-questionnaire mesurant l'impulsivité trait. Facteur de risque suicidaire dans la dépression résistante.
  severity_thresholds:
  - min_score: 30.0
    max_score: 52.0
    code: low
    label_fr: Impulsivité basse
    clinical_meaning_fr: Niveau d'impulsivité inférieur à la normale, bon contrôle comportemental.
  - min_score: 53.0
    max_score: 71.0
    code: normal
    label_fr: Impulsivité normale
    clinical_meaning_fr: Niveau d'impulsivité dans les limites normales.
  - min_score: 72.0
    max_score: 120.0
    code: high
    label_fr: Impulsivité élevée
    clinical_meaning_fr: Impulsivité élevée, facteur de risque pour les conduites à risque et la mauvaise observance thérapeutique.
