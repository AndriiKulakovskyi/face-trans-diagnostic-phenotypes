# Complete CSV extraction layout for the ASP (TSASDI / Autism) cohort.
$schema_version: 1

patient_id_column: usubjid_identite

demographics:
  age: age
  sex: sex
  site_id: siteid
  arm: arm
  education_level: edulevel
  employment: empjob1
  employment_alt: empjob2
  # ASP has no maristat

vitals:
  bmi: bmi

# ─── ASP-specific: autism diagnostic profile ────────────────────────────────
autism_diagnosis:
  dsm_type: dsmtype
  dsm_domain1: dsmv1
  dsm_domain2: dsmv2
  adi_diagnostic: adi_diag
  ados_exam: adosexam
  dsm_criteria:
    dsmaut01: "Déficits de réciprocité socio-émotionnelle"
    dsmaut02: "Déficits de communication non verbale"
    dsmaut03: "Déficits dans les relations"
    dsmaut04: "Mouvements stéréotypés ou répétitifs"
    dsmaut05: "Insistance sur la similitude / routines"
    dsmaut06: "Intérêts restreints et fixes"
    dsmaut07: "Hyper/hypo-réactivité sensorielle"
    dsmaut08: "Symptômes présents dès le développement"
    dsmaut09: "Retentissement cliniquement significatif"
    dsmaut10: "Non mieux expliqué par DI ou retard global"
    dsmaut11: "Avec ou sans déficience intellectuelle"

# ─── ASP-specific: developmental history ────────────────────────────────────
developmental_history:
  age_motor_milestones: agemots
  age_first_phrases: agephras
  mother_age: agemere
  father_age: agepere
  psychomotor_delay: retpsy
  language_delay: retlang
  fetal_distress: souffet
  neonatal_complications: neonat
  resuscitation: reanim
  pregnancy_pathology: pathgro
  fetal_pathology: pathfeta
  neonatal_illness: affecbb
  feeding_difficulties: tralim
  sleep_difficulties: trsomm
  twin: gemel
  seizures: crisconv
  birth_weight_g: naispoid
  birth_height_cm: naistail
  apgar_score: apgar1
  language_expression: langx
  current_language: langact

# ─── ASP-specific: clinical status ──────────────────────────────────────────
clinical_status:
  age_at_diagnosis_years: adiagea
  age_at_diagnosis_months: adiagem
  in_psychiatric_care: contpsy
  currently_hospitalized: hospicour
  currently_treated: trtcour
  has_insomnia: insom
  has_hypersomnia: hypers
  executive_function_impairment: fctexe
  social_cognition_impairment: cogsoc
  school_level: nivmaxc
  school_type: scolass

# ─── ASP-specific: medical antecedents ──────────────────────────────────────
medical_antecedents:
  cardiac: antcardi
  endocrine: antendo
  neurological: antneuro
  ent: antorl
  pulmonary: antpulm
  rheumatological: antrhum
  hepatic: anthepa
  cancer: antcanc
  genetic_disorder: malgen
  other_condition: autrmal

# ─── ASP-specific: pregnancy/toxicology ─────────────────────────────────────
pregnancy_toxicology:
  toxicology_exposure: tox
  folic_acid_supplementation: gros_fol
  bleeding_during_pregnancy: saign
  infection_viral: infevir

# ─── ASP-specific: learning disabilities ────────────────────────────────────
learning_disabilities:
  dyslexia: neuro_dyslex
  dysorthography: neuro_dysor
  dyscalculia: neuro_dyscal
  dysphasia: neuro_dysph
  dyspraxia: neuro_dyspra
  speech_disorder: neuro_parol
  stuttering: neuro_begai

# ─── ASP-specific: MCDD criteria (mcdd1..mcdd15) ────────────────────────────
mcdd:
  col_prefix: mcdd
  count: 15

# ─── ASP-specific treatments ────────────────────────────────────────────────
treatments:
  antidepressant: antidepc
  antipsychotic: antipsyc
  lamotrigine: lamotrig
  non_pharm_prefix: trt_non_parmaco_
  non_pharm_count: 15

# ─── ASP-specific substance use (uses tabac + prism items, not suoccur_*) ───
substance_use:
  tobacco: tabac
  cigarettes_per_day: tabacnj
  # PRISM item-level mapping for ASP
  prism_items:
    alcohol: prism01a
    cannabis: prism03a
    sedatives: {col: prism02a, label_fr: "Sédatifs"}
    stimulants: {col: prism04a, label_fr: "Stimulants"}
    opioids: {col: prism05a, label_fr: "Opioïdes"}
    cocaine: {col: prism06a, label_fr: "Cocaïne"}
    hallucinogens: {col: prism07a, label_fr: "Hallucinogènes"}

# ─── ASP-specific comorbidities ─────────────────────────────────────────────
comorbidities:
  somatic:
    - {col: epilepsie, label_fr: "Épilepsie"}
    - {col: diabete,   label_fr: "Diabète"}
    - {col: thyroide,  label_fr: "Trouble thyroïdien"}
    - {col: cardio,    label_fr: "Pathologie cardiovasculaire"}
  psychiatric:
    - {col: edm,      label_fr: "Épisode dépressif majeur"}
    - {col: man,      label_fr: "Manie"}
    - {col: hman,     label_fr: "Hypomanie"}
    - {col: mix,      label_fr: "Épisode mixte"}
    - {col: tdi,      label_fr: "Dysthymie"}
    - {col: tdr,      label_fr: "Dépression récurrente"}
    - {col: td,       label_fr: "Dépression"}
    - {col: tb,       label_fr: "Trouble bipolaire"}
    - {col: symppsyh, label_fr: "Symptômes psychotiques"}
    - {col: tskizo,   label_fr: "Schizophrénie"}
    - {col: utisubst, label_fr: "Usage de substances"}
    - {col: tranxi,   label_fr: "Trouble anxieux"}
    - {col: tbath,    label_fr: "Trouble des conduites alimentaires"}
    - {col: tbopp,    label_fr: "Trouble oppositionnel avec provocation"}
    - {col: tcond,    label_fr: "Trouble des conduites"}
    - {col: tcsfinc,  label_fr: "Énurésie/Encoprésie"}
    - {col: tcali,    label_fr: "Pica"}
    - {col: ticchr,   label_fr: "Tics chroniques"}

# Partial suicide risk mitigation (no C-SSRS/ISF in ASP)
bdi_item9: bdi0209
