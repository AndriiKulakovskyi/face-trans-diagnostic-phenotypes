$schema_version: 1
QIDS-SR16:
  name: QIDS-SR16
  full_name: Quick Inventory of Depressive Symptomatology — Self-Report 16
  full_name_fr: Inventaire rapide de la symptomatologie dépressive — auto-évaluation
  domain: depression_self_report
  total_column: qidsr120
  score_range:
  - 0
  - 27
  higher_is_worse: true
  evaluation_type: auto
  clinical_note_fr: Auto-questionnaire de dépression (16 items), mesure complémentaire à la MADRS hétéro-évaluée.
  severity_thresholds:
  - min_score: 0
    max_score: 5
    code: normal
    label_fr: Pas de dépression
    clinical_meaning_fr: Absence de symptomatologie dépressive significative à l'auto-évaluation.
  - min_score: 6
    max_score: 10
    code: mild
    label_fr: Dépression légère
    clinical_meaning_fr: Symptômes dépressifs légers rapportés par le patient ; concordance avec la MADRS à vérifier.
  - min_score: 11
    max_score: 15
    code: moderate
    label_fr: Dépression modérée
    clinical_meaning_fr: Symptômes dépressifs modérés à l'auto-évaluation, justifiant une prise en charge active.
  - min_score: 16
    max_score: 20
    code: severe
    label_fr: Dépression sévère
    clinical_meaning_fr: Symptômes dépressifs sévères rapportés par le patient, avec retentissement fonctionnel probable.
  - min_score: 21
    max_score: 27
    code: very_severe
    label_fr: Dépression très sévère
    clinical_meaning_fr: Symptômes dépressifs très sévères à l'auto-évaluation, nécessitant une réévaluation urgente du traitement.
BIS-10:
  name: BIS-10
  full_name: Barratt Impulsiveness Scale - version 10
  full_name_fr: Échelle d'impulsivité de Barratt (BIS-10)
  domain: impulsivity
  total_column: bis10_score_total
  score_range:
  - 30
  - 120
  higher_is_worse: true
  evaluation_type: auto
  clinical_note_fr: Auto-questionnaire mesurant l'impulsivité trait (attentionnelle, motrice, planification).
  subscale_columns:
    Impulsivité attentionnelle: bis10_imp_att
    Impulsivité motrice: bis10_imp_mot
    Impulsivité de planification: bis10_imp_pla
  severity_thresholds:
  - min_score: 30
    max_score: 52
    code: low
    label_fr: Impulsivité basse
    clinical_meaning_fr: Niveau d'impulsivité inférieur à la normale, bon contrôle comportemental.
  - min_score: 53
    max_score: 71
    code: normal
    label_fr: Impulsivité normale
    clinical_meaning_fr: Niveau d'impulsivité dans les limites normales.
  - min_score: 72
    max_score: 120
    code: high
    label_fr: Impulsivité élevée
    clinical_meaning_fr: Impulsivité élevée, facteur de risque pour les conduites à risque et la mauvaise observance thérapeutique.
BDHI:
  name: BDHI
  full_name: Buss-Durkee Hostility Inventory
  full_name_fr: Inventaire d'hostilité de Buss-Durkee
  domain: hostility
  total_column: bdhi85
  score_range:
  - 0
  - 75
  higher_is_worse: true
  evaluation_type: auto
  clinical_note_fr: Auto-questionnaire mesurant les différentes composantes de l'hostilité et de l'agressivité.
  subscale_columns:
    Agressivité (Assault): bdhi76
    Hostilité indirecte: bdhi77
    Irritabilité: bdhi78
    Négativisme: bdhi79
    Ressentiment: bdhi80
    Suspicion: bdhi81
    Hostilité verbale: bdhi82
    Culpabilité: bdhi83
    Composante attitudinale: bdhi84
  severity_thresholds:
  - min_score: 0
    max_score: 15
    code: low
    label_fr: Hostilité basse
    clinical_meaning_fr: Niveau d'hostilité et d'agressivité bas, bon contrôle des impulsions agressives.
  - min_score: 16
    max_score: 25
    code: moderate
    label_fr: Hostilité modérée
    clinical_meaning_fr: Niveau d'hostilité modéré, à surveiller dans le contexte des épisodes thymiques.
  - min_score: 26
    max_score: 75
    code: high
    label_fr: Hostilité élevée
    clinical_meaning_fr: Hostilité élevée, facteur de risque de passages à l'acte agressifs, en particulier en phase maniaque ou mixte.
ALS:
  name: ALS
  full_name: Affective Lability Scale — short form
  full_name_fr: Échelle de labilité affective (forme courte)
  domain: affective_lability
  total_column: als_
  score_range:
  - 0
  - 3
  higher_is_worse: true
  evaluation_type: auto
  clinical_note_fr: Auto-questionnaire mesurant la labilité émotionnelle (fluctuations rapides entre différents états affectifs).
  severity_thresholds:
  - min_score: 0
    max_score: 0.99
    code: low
    label_fr: Labilité affective basse
    clinical_meaning_fr: Stabilité émotionnelle satisfaisante, pas de fluctuations affectives significatives.
  - min_score: 1.0
    max_score: 1.69
    code: moderate
    label_fr: Labilité affective modérée
    clinical_meaning_fr: Fluctuations émotionnelles modérées, fréquentes chez les patients bipolaires même en euthymie.
  - min_score: 1.7
    max_score: 3.0
    code: high
    label_fr: Labilité affective élevée
    clinical_meaning_fr: Labilité affective marquée, facteur de risque d'instabilité thymique et de mauvais fonctionnement interpersonnel.
AIM:
  name: AIM
  full_name: Affect Intensity Measure — short form
  full_name_fr: Mesure d'intensité affective (forme courte)
  domain: affect_intensity
  total_column: aim_
  score_range:
  - 1
  - 6
  higher_is_worse: true
  evaluation_type: auto
  clinical_note_fr: Auto-questionnaire mesurant l'intensité des réactions émotionnelles (trait).
  severity_thresholds:
  - min_score: 1.0
    max_score: 2.9
    code: low
    label_fr: Intensité affective basse
    clinical_meaning_fr: Réactivité émotionnelle atténuée, émotions vécues avec une faible intensité.
  - min_score: 3.0
    max_score: 4.0
    code: moderate
    label_fr: Intensité affective modérée
    clinical_meaning_fr: Intensité émotionnelle dans les limites normales.
  - min_score: 4.1
    max_score: 6.0
    code: high
    label_fr: Intensité affective élevée
    clinical_meaning_fr: Intensité émotionnelle élevée, les émotions sont vécues de manière très intense, associée au tempérament cyclothymique.
STOP-Bang:
  name: STOP-Bang
  full_name: STOP-Bang Sleep Apnea Questionnaire
  full_name_fr: Questionnaire STOP-Bang d'apnées du sommeil
  domain: sleep_apnea_screening
  total_column: apnee_
  score_range:
  - 0
  - 8
  higher_is_worse: true
  evaluation_type: auto
  clinical_note_fr: Questionnaire de dépistage du syndrome d'apnées obstructives du sommeil (8 items oui/non).
COBRA:
  name: COBRA
  full_name: Cognitive Complaints in Bipolar Disorder Rating Assessment
  full_name_fr: Évaluation des plaintes cognitives dans le trouble bipolaire
  domain: cognitive_complaints
  total_column: cobra_
  score_range:
  - 0
  - 48
  higher_is_worse: true
  evaluation_type: auto
  clinical_note_fr: Auto-questionnaire mesurant les plaintes cognitives subjectives spécifiques au trouble bipolaire.
  severity_thresholds:
  - min_score: 0
    max_score: 10
    code: normal
    label_fr: Pas de plainte cognitive significative
    clinical_meaning_fr: Le patient ne rapporte pas de difficultés cognitives significatives.
  - min_score: 11
    max_score: 20
    code: mild
    label_fr: Plaintes cognitives légères
    clinical_meaning_fr: Plaintes cognitives subjectives légères, fréquentes chez les patients bipolaires même en rémission.
  - min_score: 21
    max_score: 48
    code: significant
    label_fr: Plaintes cognitives significatives
    clinical_meaning_fr: Plaintes cognitives subjectives importantes, corrélées à un retentissement fonctionnel ; un bilan neuropsychologique est recommandé.
SCIP:
  name: SCIP
  full_name: Screen for Cognitive Impairment in Psychiatry
  full_name_fr: Dépistage de l'altération cognitive en psychiatrie
  domain: cognitive_screening
  total_column: scipv01a_
  score_range:
  - 0
  - 100
  higher_is_worse: true
  evaluation_type: hetero
  clinical_note_fr: Batterie brève de dépistage cognitif en psychiatrie (5 subtests, formes parallèles A/B). Résultats à interpréter par subtest.
  subscale_columns:
    Mémoire de travail (immédiat): scipv01a_
    Mémoire de travail (différé): scipv01b_
    Fluence verbale (immédiat): scipv02a_
    Fluence verbale (différé): scipv02b_
    Vitesse psychomotrice (immédiat): scipv03a_
    Vitesse psychomotrice (différé): scipv03b_
    Mémoire verbale (immédiat): scipv04a_
    Mémoire verbale (différé): scipv04b_
    Planification (immédiat): scipv05a_
    Planification (différé): scipv05b_
C-SSRS:
  name: C-SSRS
  full_name: Columbia Suicide Severity Rating Scale
  full_name_fr: Échelle d'évaluation de la sévérité suicidaire de Columbia
  domain: suicide_risk
  total_column: css0106
  score_range:
  - 1
  - 5
  higher_is_worse: true
  evaluation_type: hetero
  clinical_note_fr: Hétéro-évaluation de la sévérité de l'idéation et du comportement suicidaire. Instrument de référence pour l'évaluation du risque suicidaire.
  subscale_columns:
    Fréquence: css0108
    Durée: css0109
    Maîtrise: css0110
    Éléments dissuasifs: css0111
    Causes de l'idéation: css0112
  severity_thresholds:
  - min_score: 1
    max_score: 1
    code: wish_to_be_dead
    label_fr: Désir de mort
    clinical_meaning_fr: 'Idéation passive : souhait de mourir sans plan suicidaire actif. Surveillance rapprochée recommandée.'
  - min_score: 2
    max_score: 2
    code: nonspecific_ideation
    label_fr: Idéation suicidaire non spécifique
    clinical_meaning_fr: Pensées suicidaires actives sans méthode définie. Évaluation approfondie du risque nécessaire.
  - min_score: 3
    max_score: 3
    code: ideation_with_method
    label_fr: Idéation avec méthode
    clinical_meaning_fr: Idéation suicidaire active avec méthode identifiée mais sans intention de passage à l'acte. Risque modéré à élevé.
  - min_score: 4
    max_score: 4
    code: ideation_with_intent
    label_fr: Idéation avec intention
    clinical_meaning_fr: Idéation suicidaire active avec intention de passage à l'acte sans plan précis. Risque élevé, intervention urgente.
  - min_score: 5
    max_score: 5
    code: ideation_with_plan
    label_fr: Idéation avec plan précis
    clinical_meaning_fr: Idéation suicidaire active avec scénario précis et intention de passage à l'acte. Risque imminent, hospitalisation à considérer.
ALDA:
  name: ALDA
  full_name: Alda Lithium Response Scale
  full_name_fr: Échelle de réponse au lithium d'Alda
  domain: lithium_response
  total_column: alda_
  score_range:
  - 0
  - 10
  higher_is_worse: true
  evaluation_type: hetero
  clinical_note_fr: Échelle hétéro-évaluée mesurant la qualité de la réponse au lithium (A = efficacité, B = facteurs confondants). Score A - B pour le score total.
  subscale_columns:
    Score A (efficacité): aldaa
    Score B (facteurs confondants): aldab
  severity_thresholds:
  - min_score: 0
    max_score: 2
    code: non_responder
    label_fr: Non-répondeur au lithium
    clinical_meaning_fr: Réponse au lithium absente ou très faible. Envisager un autre thymorégulateur.
  - min_score: 3
    max_score: 6
    code: partial_responder
    label_fr: Répondeur partiel au lithium
    clinical_meaning_fr: Réponse partielle au lithium, potentialisation ou changement de traitement à discuter.
  - min_score: 7
    max_score: 10
    code: good_responder
    label_fr: Bon répondeur au lithium
    clinical_meaning_fr: Bonne réponse au lithium, profil classique de lithium-répondeur.
ASRS:
  name: ASRS
  full_name: Adult ADHD Self-Report Scale
  full_name_fr: Échelle d'auto-évaluation du TDAH de l'adulte
  domain: adhd_screening
  total_column: asrs_
  score_range:
  - 0
  - 24
  higher_is_worse: true
  evaluation_type: auto
  clinical_note_fr: Auto-questionnaire de dépistage du TDAH chez l'adulte (seuil ≥ 14).
  screening_threshold: 14
  screening_positive_label_fr: Dépistage positif de TDAH
  screening_negative_label_fr: Dépistage négatif de TDAH
WURS-25:
  name: WURS-25
  full_name: Wender Utah Rating Scale — 25 items
  full_name_fr: Échelle de Wender Utah (25 items)
  domain: childhood_adhd
  total_column: wurs
  score_range:
  - 0
  - 100
  higher_is_worse: true
  evaluation_type: auto
  clinical_note_fr: Auto-questionnaire rétrospectif de dépistage du TDAH dans l'enfance (seuil ≥ 46).
  screening_threshold: 46
  screening_positive_label_fr: Dépistage positif de TDAH de l'enfance
  screening_negative_label_fr: Dépistage négatif de TDAH de l'enfance
AQ-12:
  name: AQ-12
  full_name: Autism Spectrum Quotient — 12 items
  full_name_fr: Quotient du spectre autistique (12 items)
  domain: autism_screening
  total_column: aq1216
  score_range:
  - 0
  - 12
  higher_is_worse: true
  evaluation_type: auto
  clinical_note_fr: Auto-questionnaire de dépistage des traits du spectre autistique (seuil ≥ 6).
  screening_threshold: 6
  screening_positive_label_fr: Dépistage positif de traits autistiques
  screening_negative_label_fr: Dépistage négatif de traits autistiques
