# Shared clinical instruments used by 2+ cohorts.
# Each top-level key is an instrument ID (the registry key used by extractors).
# Cohort-specific instruments with column overrides live in {cohort}/instruments.yaml.
$schema_version: 1

MADRS:
  name: MADRS
  full_name: "Montgomery-Åsberg Depression Rating Scale"
  full_name_fr: "Échelle de dépression de Montgomery-Åsberg"
  domain: depression
  total_column: madrs_
  score_range: [0, 60]
  higher_is_worse: true
  evaluation_type: hetero
  clinical_note_fr: "Hétéro-questionnaire de référence pour évaluer la sévérité dépressive."
  severity_thresholds:
    - {min_score: 0, max_score: 6, code: normal,
       label_fr: "Pas de dépression / rémission",
       clinical_meaning_fr: "Le patient ne présente pas de symptômes dépressifs significatifs, compatible avec une rémission clinique."}
    - {min_score: 7, max_score: 19, code: mild,
       label_fr: "Dépression légère",
       clinical_meaning_fr: "Symptômes dépressifs légers présents, pouvant nécessiter une surveillance sans modification thérapeutique immédiate."}
    - {min_score: 20, max_score: 34, code: moderate,
       label_fr: "Dépression modérée",
       clinical_meaning_fr: "Symptômes dépressifs d'intensité modérée avec retentissement fonctionnel, justifiant une prise en charge thérapeutique active."}
    - {min_score: 35, max_score: 60, code: severe,
       label_fr: "Dépression sévère",
       clinical_meaning_fr: "Symptômes dépressifs sévères avec retentissement fonctionnel majeur, nécessitant une prise en charge urgente et réévaluation du traitement."}

YMRS:
  name: YMRS
  full_name: "Young Mania Rating Scale"
  full_name_fr: "Échelle de manie de Young"
  domain: mania
  total_column: ymrs_
  score_range: [0, 60]
  evaluation_type: hetero
  clinical_note_fr: "Hétéro-questionnaire de référence pour évaluer la sévérité maniaque."
  severity_thresholds:
    - {min_score: 0, max_score: 7, code: normal,
       label_fr: "Pas de symptômes maniaques",
       clinical_meaning_fr: "Absence de symptômes maniaques significatifs, compatible avec un état euthymique ou dépressif."}
    - {min_score: 8, max_score: 12, code: mild,
       label_fr: "Symptômes maniaques légers",
       clinical_meaning_fr: "Symptômes maniaques infracliniques ou hypomaniaques légers nécessitant une surveillance."}
    - {min_score: 13, max_score: 19, code: moderate,
       label_fr: "Manie modérée / hypomanie",
       clinical_meaning_fr: "Symptômes maniaques d'intensité modérée compatibles avec un épisode hypomaniaque, nécessitant une réévaluation thérapeutique."}
    - {min_score: 20, max_score: 60, code: severe,
       label_fr: "Manie sévère",
       clinical_meaning_fr: "Symptômes maniaques sévères compatibles avec un épisode maniaque franc, nécessitant une prise en charge urgente."}

"CGI-S":
  name: "CGI-S"
  full_name: "Clinical Global Impression - Severity"
  full_name_fr: "Impression clinique globale — Sévérité"
  domain: global_severity
  total_column: cgi01
  subscale_columns:
    "CGI-I (amélioration)": cgi02
    "CGI efficacité thérapeutique": cgi03
  score_range: [1, 7]
  evaluation_type: hetero
  clinical_note_fr: "Évaluation globale par le clinicien de la sévérité de la maladie psychiatrique."
  severity_thresholds:
    - {min_score: 1, max_score: 1, code: normal,
       label_fr: "Normal, pas du tout malade",
       clinical_meaning_fr: "Le patient ne présente aucun symptôme psychiatrique identifiable."}
    - {min_score: 2, max_score: 2, code: borderline,
       label_fr: "À la limite",
       clinical_meaning_fr: "Symptômes psychiatriques à la limite du pathologique, ne nécessitant pas de traitement spécifique."}
    - {min_score: 3, max_score: 3, code: mild,
       label_fr: "Légèrement malade",
       clinical_meaning_fr: "Symptômes légers avec un retentissement fonctionnel minime."}
    - {min_score: 4, max_score: 4, code: moderate,
       label_fr: "Modérément malade",
       clinical_meaning_fr: "Symptômes modérés avec retentissement fonctionnel notable nécessitant un suivi thérapeutique."}
    - {min_score: 5, max_score: 5, code: markedly_ill,
       label_fr: "Manifestement malade",
       clinical_meaning_fr: "Symptômes marqués avec retentissement fonctionnel important, traitement actif indiqué."}
    - {min_score: 6, max_score: 6, code: severe,
       label_fr: "Gravement malade",
       clinical_meaning_fr: "Symptômes sévères avec altération fonctionnelle majeure, prise en charge intensive nécessaire."}
    - {min_score: 7, max_score: 7, code: extreme,
       label_fr: "Parmi les patients les plus malades",
       clinical_meaning_fr: "Symptômes psychiatriques d'une intensité extrême, nécessitant une prise en charge d'urgence."}

FAST:
  name: FAST
  full_name: "Functioning Assessment Short Test"
  full_name_fr: "Test court d'évaluation du fonctionnement"
  domain: functioning
  total_column: fast_
  score_range: [0, 75]
  evaluation_type: hetero
  clinical_note_fr: "Évalue le retentissement fonctionnel sur 6 domaines."
  severity_thresholds:
    - {min_score: 0, max_score: 11, code: none,
       label_fr: "Pas d'altération fonctionnelle",
       clinical_meaning_fr: "Fonctionnement global préservé, pas de handicap significatif dans les activités quotidiennes."}
    - {min_score: 12, max_score: 20, code: mild,
       label_fr: "Altération fonctionnelle légère",
       clinical_meaning_fr: "Difficultés fonctionnelles légères, principalement perceptibles dans les situations exigeantes."}
    - {min_score: 21, max_score: 40, code: moderate,
       label_fr: "Altération fonctionnelle modérée",
       clinical_meaning_fr: "Difficultés fonctionnelles modérées affectant plusieurs domaines (travail, relations, autonomie)."}
    - {min_score: 41, max_score: 75, code: severe,
       label_fr: "Altération fonctionnelle sévère",
       clinical_meaning_fr: "Altération fonctionnelle majeure avec handicap significatif dans la vie quotidienne."}

"STAI-YA":
  name: "STAI-YA"
  full_name: "State-Trait Anxiety Inventory — State form"
  full_name_fr: "Inventaire d'anxiété État-Trait — forme État"
  domain: anxiety
  total_column: staya
  score_range: [20, 80]
  evaluation_type: auto
  clinical_note_fr: "Mesure l'anxiété situationnelle (état) au moment de l'évaluation."
  severity_thresholds:
    - {min_score: 20, max_score: 35, code: low,
       label_fr: "Anxiété état basse",
       clinical_meaning_fr: "Anxiété état faible, pas de symptômes anxieux significatifs au moment de l'évaluation."}
    - {min_score: 36, max_score: 55, code: moderate,
       label_fr: "Anxiété état modérée",
       clinical_meaning_fr: "Anxiété état d'intensité modérée, pouvant refléter une composante anxieuse du trouble de l'humeur."}
    - {min_score: 56, max_score: 80, code: high,
       label_fr: "Anxiété état élevée",
       clinical_meaning_fr: "Anxiété état élevée, cliniquement significative, à explorer comme comorbidité anxieuse ou symptôme mixte."}

ASRM:
  name: ASRM
  full_name: "Altman Self-Rating Mania Scale"
  full_name_fr: "Échelle d'auto-évaluation de la manie d'Altman"
  domain: mania_self_report
  total_column: altman_
  score_range: [0, 20]
  evaluation_type: auto
  screening_threshold: 6
  screening_positive_label_fr: "Dépistage positif d'hypomanie/manie"
  screening_negative_label_fr: "Dépistage négatif d'hypomanie/manie"
  clinical_note_fr: "Auto-questionnaire de dépistage de l'hypomanie/manie (seuil >= 6)."

MAThyS:
  name: MAThyS
  full_name: "Multidimensional Assessment of Thymic States"
  full_name_fr: "Évaluation multidimensionnelle des états thymiques"
  domain: mood_self_report
  total_column: mathys_
  score_range: [0, 200]
  evaluation_type: auto
  clinical_note_fr: "Auto-questionnaire dimensionnel évaluant l'activation/inhibition thymique."
  severity_thresholds:
    - {min_score: 0, max_score: 79, code: inhibition,
       label_fr: "Inhibition",
       clinical_meaning_fr: "État d'inhibition psychomotrice prédominant, compatible avec une composante dépressive."}
    - {min_score: 80, max_score: 120, code: euthymia,
       label_fr: "Euthymie",
       clinical_meaning_fr: "État thymique dans les limites normales selon l'auto-évaluation."}
    - {min_score: 121, max_score: 200, code: activation,
       label_fr: "Activation",
       clinical_meaning_fr: "État d'activation psychomotrice prédominant, compatible avec une composante (hypo)maniaque."}

PSQI:
  name: PSQI
  full_name: "Pittsburgh Sleep Quality Index"
  full_name_fr: "Index de qualité du sommeil de Pittsburgh"
  domain: sleep
  total_column: psqi_
  score_range: [0, 21]
  evaluation_type: auto
  severity_thresholds_ref: PSQI_THRESHOLDS
  clinical_note_fr: "Auto-questionnaire évaluant la qualité du sommeil sur le dernier mois."

ESS:
  name: ESS
  full_name: "Epworth Sleepiness Scale"
  full_name_fr: "Échelle de somnolence d'Epworth"
  domain: sleepiness
  total_column: ess0109
  score_range: [0, 24]
  evaluation_type: auto
  severity_thresholds_ref: ESS_THRESHOLDS
  clinical_note_fr: "Auto-questionnaire mesurant la somnolence diurne excessive."

MARS:
  name: MARS
  full_name: "Medication Adherence Rating Scale"
  full_name_fr: "Échelle d'évaluation de l'observance médicamenteuse"
  domain: adherence
  total_column: mars_
  score_range: [0, 10]
  higher_is_worse: false
  evaluation_type: auto
  severity_thresholds_ref: MARS_THRESHOLDS
  clinical_note_fr: "Auto-questionnaire évaluant l'adhésion au traitement médicamenteux."

CTQ:
  name: CTQ
  full_name: "Childhood Trauma Questionnaire"
  full_name_fr: "Questionnaire sur les traumatismes de l'enfance"
  domain: childhood_trauma
  total_column: ctq39
  subscale_columns:
    "Abus physique": ctq29
    "Négligence émotionnelle": ctq31
    "Négligence physique": ctq33
    "Abus sexuel": ctq35
    "Abus émotionnel": ctq37
  score_range: [25, 125]
  evaluation_type: auto
  severity_thresholds_ref: CTQ_THRESHOLDS
  clinical_note_fr: "Auto-questionnaire rétrospectif évaluant 5 types de maltraitance dans l'enfance. Facteur pronostique majeur."

CSM:
  name: CSM
  full_name: "Composite Scale of Morningness"
  full_name_fr: "Échelle composite de matinalité"
  domain: chronotype
  total_column: csm_
  score_range: [13, 55]
  evaluation_type: auto
  clinical_note_fr: "Auto-questionnaire évaluant le chronotype (préférence matin/soir)."
  severity_thresholds:
    - {min_score: 13, max_score: 22, code: evening,
       label_fr: "Chronotype vespéral (couche-tard)",
       clinical_meaning_fr: "Chronotype de type vespéral marqué, associé à un risque accru de déstabilisation thymique et de mauvaise observance."}
    - {min_score: 23, max_score: 30, code: moderate_evening,
       label_fr: "Chronotype modérément vespéral",
       clinical_meaning_fr: "Tendance vespérale modérée, à surveiller pour l'hygiène du sommeil."}
    - {min_score: 31, max_score: 40, code: intermediate,
       label_fr: "Chronotype intermédiaire",
       clinical_meaning_fr: "Chronotype intermédiaire, rythme circadien dans les limites normales."}
    - {min_score: 41, max_score: 48, code: moderate_morning,
       label_fr: "Chronotype modérément matinal",
       clinical_meaning_fr: "Tendance matinale modérée, rythme circadien stable."}
    - {min_score: 49, max_score: 55, code: morning,
       label_fr: "Chronotype matinal",
       clinical_meaning_fr: "Chronotype matinal marqué, généralement associé à une meilleure stabilité thymique."}

MDQ:
  name: MDQ
  full_name: "Mood Disorder Questionnaire"
  full_name_fr: "Questionnaire sur les troubles de l'humeur"
  domain: bipolar_screening
  total_column: mdq_
  score_range: [0, 13]
  evaluation_type: auto
  screening_threshold: 7
  screening_positive_label_fr: "Dépistage positif de trouble bipolaire"
  screening_negative_label_fr: "Dépistage négatif de trouble bipolaire"
  clinical_note_fr: "Auto-questionnaire de dépistage du trouble bipolaire (seuil >= 7)."

Fagerström:
  name: Fagerström
  full_name: "Fagerström Test for Nicotine Dependence"
  full_name_fr: "Test de Fagerström de dépendance à la nicotine"
  domain: nicotine_dependence
  total_column: fagers
  score_range: [0, 10]
  evaluation_type: auto
  severity_thresholds_ref: FAGERSTROM_THRESHOLDS
  clinical_note_fr: "Auto-questionnaire évaluant le degré de dépendance à la nicotine."

PRISM:
  name: PRISM
  full_name: "Psychiatric Research Interview for Substance and Mental Disorders"
  full_name_fr: "Entretien de recherche psychiatrique pour les troubles liés aux substances"
  domain: substance_use_disorders
  total_column: prism
  score_range: [0, 20]
  evaluation_type: hetero
  screening_threshold: 1
  screening_positive_label_fr: "Comorbidité addictologique détectée"
  screening_negative_label_fr: "Pas de comorbidité addictologique détectée"
  clinical_note_fr: "Entretien structuré évaluant les troubles liés à l'usage de substances."

"EQ-5D":
  name: "EQ-5D"
  full_name: "EuroQol 5 Dimensions"
  full_name_fr: "EuroQol 5 dimensions — qualité de vie"
  domain: quality_of_life
  total_column: eq5d_
  score_range: [0, 1]
  higher_is_worse: false
  evaluation_type: auto
  severity_thresholds_ref: EQ5D_THRESHOLDS
  unit: "(index)"
  clinical_note_fr: "Mesure générique de la qualité de vie liée à la santé."
