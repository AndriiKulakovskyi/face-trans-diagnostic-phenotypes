# Reusable severity band lists shared across cohorts.
# Each top-level key is a threshold_id that instruments reference via severity_thresholds_ref.
# Bands are inclusive on both ends (min_score <= raw <= max_score).
$schema_version: 1

PSQI_THRESHOLDS:
  source: "Buysse et al. 1989"
  bands:
    - {min_score: 0, max_score: 5, code: good,
       label_fr: "Bonne qualité de sommeil",
       clinical_meaning_fr: "Qualité de sommeil satisfaisante, pas de trouble du sommeil cliniquement significatif."}
    - {min_score: 6, max_score: 10, code: poor,
       label_fr: "Mauvaise qualité de sommeil",
       clinical_meaning_fr: "Qualité de sommeil altérée, des troubles du sommeil sont présents et méritent une évaluation."}
    - {min_score: 11, max_score: 21, code: very_poor,
       label_fr: "Très mauvaise qualité de sommeil",
       clinical_meaning_fr: "Troubles du sommeil sévères, retentissement probable sur le fonctionnement diurne et la stabilité thymique."}

ESS_THRESHOLDS:
  source: "Johns 1991"
  bands:
    - {min_score: 0, max_score: 7, code: normal,
       label_fr: "Somnolence diurne normale",
       clinical_meaning_fr: "Pas de somnolence diurne excessive."}
    - {min_score: 8, max_score: 9, code: average,
       label_fr: "Somnolence diurne moyenne",
       clinical_meaning_fr: "Somnolence diurne à la limite supérieure de la normale."}
    - {min_score: 10, max_score: 15, code: excessive,
       label_fr: "Somnolence diurne excessive",
       clinical_meaning_fr: "Somnolence diurne excessive, à explorer (apnées, effet sédatif des traitements, qualité du sommeil)."}
    - {min_score: 16, max_score: 24, code: severe,
       label_fr: "Somnolence diurne sévère",
       clinical_meaning_fr: "Somnolence diurne sévère, risque d'endormissement dans les activités quotidiennes."}

MARS_THRESHOLDS:
  source: "Thompson et al. 2000"
  bands:
    - {min_score: 0, max_score: 5, code: poor,
       label_fr: "Mauvaise observance",
       clinical_meaning_fr: "Observance médicamenteuse insuffisante, facteur de risque de rechute."}
    - {min_score: 6, max_score: 7, code: moderate,
       label_fr: "Observance partielle",
       clinical_meaning_fr: "Observance médicamenteuse partielle, nécessitant un travail sur l'alliance thérapeutique."}
    - {min_score: 8, max_score: 10, code: good,
       label_fr: "Bonne observance",
       clinical_meaning_fr: "Bonne observance médicamenteuse."}

FAGERSTROM_THRESHOLDS:
  source: "Heatherton et al. 1991"
  bands:
    - {min_score: 0, max_score: 2, code: low,
       label_fr: "Dépendance faible",
       clinical_meaning_fr: "Dépendance à la nicotine faible ou absente."}
    - {min_score: 3, max_score: 4, code: moderate_low,
       label_fr: "Dépendance modérée basse",
       clinical_meaning_fr: "Dépendance à la nicotine modérée basse. Un soutien au sevrage pourrait être bénéfique."}
    - {min_score: 5, max_score: 6, code: moderate,
       label_fr: "Dépendance modérée",
       clinical_meaning_fr: "Dépendance à la nicotine modérée. Substitution nicotinique recommandée en cas de tentative de sevrage."}
    - {min_score: 7, max_score: 8, code: high,
       label_fr: "Dépendance forte",
       clinical_meaning_fr: "Forte dépendance à la nicotine. Traitement pharmacologique du sevrage à envisager."}
    - {min_score: 9, max_score: 10, code: very_high,
       label_fr: "Dépendance très forte",
       clinical_meaning_fr: "Dépendance très forte à la nicotine. Prise en charge addictologique spécialisée recommandée."}

EQ5D_THRESHOLDS:
  source: "EuroQol Group 1990"
  bands:
    - {min_score: 0.0, max_score: 0.49, code: poor,
       label_fr: "Qualité de vie médiocre",
       clinical_meaning_fr: "Qualité de vie significativement altérée, retentissement majeur de la maladie."}
    - {min_score: 0.5, max_score: 0.74, code: moderate,
       label_fr: "Qualité de vie modérée",
       clinical_meaning_fr: "Qualité de vie partiellement altérée."}
    - {min_score: 0.75, max_score: 1.0, code: good,
       label_fr: "Bonne qualité de vie",
       clinical_meaning_fr: "Qualité de vie préservée ou peu altérée."}

CTQ_THRESHOLDS:
  source: "Bernstein et al. 2003"
  bands:
    - {min_score: 25, max_score: 36, code: none_minimal,
       label_fr: "Pas de trauma / minimal",
       clinical_meaning_fr: "Pas d'antécédent traumatique significatif rapporté dans l'enfance."}
    - {min_score: 37, max_score: 51, code: low_moderate,
       label_fr: "Trauma léger à modéré",
       clinical_meaning_fr: "Antécédents traumatiques de l'enfance de sévérité légère à modérée ; à explorer en entretien clinique."}
    - {min_score: 52, max_score: 68, code: moderate_severe,
       label_fr: "Trauma modéré à sévère",
       clinical_meaning_fr: "Antécédents traumatiques de l'enfance de sévérité modérée à sévère, facteur de risque de mauvais pronostic et de résistance au traitement."}
    - {min_score: 69, max_score: 125, code: severe_extreme,
       label_fr: "Trauma sévère à extrême",
       clinical_meaning_fr: "Antécédents traumatiques de l'enfance sévères à extrêmes, associés à un risque accru de suicide, de comorbidités et de résistance au traitement."}

EGF_THRESHOLDS:
  source: "DSM-IV-TR GAF"
  bands:
    - {min_score: 91, max_score: 100, code: superior,
       label_fr: "Fonctionnement supérieur",
       clinical_meaning_fr: "Fonctionnement supérieur dans tous les domaines, aucun symptôme significatif."}
    - {min_score: 81, max_score: 90, code: good,
       label_fr: "Bon fonctionnement",
       clinical_meaning_fr: "Symptômes absents ou minimes, bon fonctionnement dans tous les domaines."}
    - {min_score: 71, max_score: 80, code: slight,
       label_fr: "Symptômes légers",
       clinical_meaning_fr: "Si symptômes présents, ils sont transitoires et prévisibles. Légère altération fonctionnelle."}
    - {min_score: 61, max_score: 70, code: mild,
       label_fr: "Difficultés légères",
       clinical_meaning_fr: "Quelques symptômes légers ou difficultés fonctionnelles mineures."}
    - {min_score: 51, max_score: 60, code: moderate,
       label_fr: "Symptômes modérés",
       clinical_meaning_fr: "Symptômes modérés ou difficultés fonctionnelles modérées."}
    - {min_score: 41, max_score: 50, code: serious,
       label_fr: "Symptômes sérieux",
       clinical_meaning_fr: "Symptômes sérieux ou altération fonctionnelle importante dans un domaine."}
    - {min_score: 31, max_score: 40, code: major,
       label_fr: "Altération majeure",
       clinical_meaning_fr: "Altération dans plusieurs domaines ou altération du sens de la réalité."}
    - {min_score: 21, max_score: 30, code: severe,
       label_fr: "Comportement influencé",
       clinical_meaning_fr: "Comportement considérablement influencé par les symptômes ou altération majeure de la communication."}
    - {min_score: 11, max_score: 20, code: very_severe,
       label_fr: "Danger potentiel",
       clinical_meaning_fr: "Danger potentiel pour soi ou pour autrui, ou altération grave de la communication."}
    - {min_score: 1, max_score: 10, code: extreme,
       label_fr: "Danger persistant",
       clinical_meaning_fr: "Danger persistant ou incapacité totale de maintien de l'hygiène personnelle minimale."}

BIS_THRESHOLDS:
  source: "Patton et al. 1995; Stanford et al. 2009"
  bands:
    - {min_score: 30, max_score: 52, code: low,
       label_fr: "Impulsivité basse",
       clinical_meaning_fr: "Niveau d'impulsivité inférieur à la normale, bon contrôle comportemental."}
    - {min_score: 53, max_score: 71, code: normal,
       label_fr: "Impulsivité normale",
       clinical_meaning_fr: "Niveau d'impulsivité dans les limites normales."}
    - {min_score: 72, max_score: 120, code: high,
       label_fr: "Impulsivité élevée",
       clinical_meaning_fr: "Impulsivité élevée, facteur de risque pour les conduites à risque et la mauvaise observance thérapeutique."}
