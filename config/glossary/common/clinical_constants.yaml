# Clinical constants: BMI WHO staging, metabolic syndrome criteria,
# Framingham CV risk, sex-specific lab ranges, drug-drug interactions,
# medication-lab monitoring alerts, and cognitive normative tables.
$schema_version: 1

# ─── BMI WHO staging (upper bounds exclusive) ────────────────────────────────

bmi_categories:
  - {max: 18.5, code: underweight, label_fr: "Insuffisance pondérale"}
  - {max: 25.0, code: normal,      label_fr: "Poids normal"}
  - {max: 30.0, code: overweight,  label_fr: "Surpoids"}
  - {max: 35.0, code: obesity_1,   label_fr: "Obésité classe I"}
  - {max: 40.0, code: obesity_2,   label_fr: "Obésité classe II"}
  - {max: null, code: obesity_3,   label_fr: "Obésité classe III (morbide)"}

# ─── Metabolic syndrome (IDF / ATP-III) ──────────────────────────────────────

metabolic_syndrome:
  source: "IDF / ATP-III"
  minimum_criteria_met: 3
  abdominal_obesity_cm: {M: 94, F: 80}
  hypertriglyceridemia_mmol_l: 1.7
  hdl_low_mmol_l: {M: 1.03, F: 1.29}
  hypertension: {sbp_mmhg: 130, dbp_mmhg: 85}
  hyperglycemia_mmol_l: 5.6

# ─── Framingham 10-year cardiovascular risk (simplified point system) ───────

framingham:
  source: "Wilson 1998 / D'Agostino 2008 (simplified)"
  age_bounds: [20, 79]
  # age_points: first match wins (evaluated top-down with descending min).
  age_points:
    M:
      - {min: 55, pts: 3}
      - {min: 45, pts: 2}
      - {min: 35, pts: 1}
    F:
      - {min: 65, pts: 3}
      - {min: 55, pts: 2}
      - {min: 45, pts: 1}
  # cholesterol: first match wins (descending min).
  cholesterol_points:
    - {min: 6.2, pts: 2}
    - {min: 5.2, pts: 1}
  # hdl: first match wins (ascending max, then min at end as protective).
  hdl_points:
    - {max: 1.0, pts: 2}
    - {max: 1.3, pts: 1}
    - {min: 1.6, pts: -1}
  # sbp_points: evaluated top-down from largest min (reverse order); first match wins.
  # untreated: >=160 -> 2, >=140 -> 1 (no point for >=120)
  # treated:   >=160 -> 3, >=140 -> 2, >=120 -> 1
  sbp_points:
    untreated:
      - {min: 160, pts: 2}
      - {min: 140, pts: 1}
    treated:
      - {min: 160, pts: 3}
      - {min: 140, pts: 2}
      - {min: 120, pts: 1}
  smoking_pts: 2
  diabetes_pts: {M: 1, F: 2}
  risk_table:
    - {max_points: 0,    risk_pct: 1.0}
    - {max_points: 2,    risk_pct: 2.0}
    - {max_points: 4,    risk_pct: 5.0}
    - {max_points: 6,    risk_pct: 8.0}
    - {max_points: 8,    risk_pct: 12.0}
    - {max_points: 10,   risk_pct: 16.0}
    - {max_points: 12,   risk_pct: 22.0}
    - {max_points: null, risk_pct: 30.0}
  categories:
    - {max_pct: 5,    label_fr: "Risque cardiovasculaire faible"}
    - {max_pct: 10,   label_fr: "Risque cardiovasculaire modéré"}
    - {max_pct: 20,   label_fr: "Risque cardiovasculaire élevé"}
    - {max_pct: null, label_fr: "Risque cardiovasculaire très élevé"}

# ─── Sex-specific lab reference ranges ──────────────────────────────────────

sex_specific_lab_ranges:
  Hemoglobin:
    aliases: ["Hémoglobine"]
    M: [13.5, 17.5]
    F: [12.0, 15.5]
  Creatinine:
    aliases: ["Créatinine"]
    M: [65, 120]
    F: [50, 100]
  "Uric acid":
    aliases: ["Acide urique"]
    M: [210, 420]
    F: [150, 360]

# ─── Drug-drug interactions ─────────────────────────────────────────────────

drug_interactions:
  - {drug1: on_lithium,   drug2: nsaid,            severity: major,
     alert_fr: "Lithium + AINS : risque de surdosage en lithium par diminution de l'excrétion rénale"}
  - {drug1: on_lithium,   drug2: on_carbamazepine, severity: major,
     alert_fr: "Lithium + carbamazépine : risque de neurotoxicité accrue (tremblements, ataxie, confusion)"}
  - {drug1: on_clozapine, drug2: on_carbamazepine, severity: contre_indication,
     alert_fr: "Clozapine + carbamazépine : CONTRE-INDICATION — risque d'agranulocytose additif"}
  - {drug1: on_lithium,   drug2: ieca,             severity: moderate,
     alert_fr: "Lithium + IEC/ARA2 : risque de surdosage en lithium, surveillance de la lithémie"}
  - {drug1: on_valproate, drug2: on_lamotrigine,   severity: moderate,
     alert_fr: "Valproate + lamotrigine : augmentation du taux de lamotrigine, risque de rash cutané sévère (Steven-Johnson)"}

severity_prefixes:
  contre_indication: "CONTRE-INDICATION"
  major: "ALERTE MAJEURE"
  moderate: "Précaution"

# ─── Medication-lab alert rules ─────────────────────────────────────────────

medication_lab_alerts:
  - id: lithium_creatinine_high
    treatment_flag: on_lithium
    lab_names: ["Créatinine", "Creatinine"]
    direction: high
    alert_fr: "Lithium + créatinine élevée : risque de néphrotoxicité, contrôle de la fonction rénale urgent"
  - id: lithium_tsh_high
    treatment_flag: on_lithium
    lab_names: ["TSH"]
    direction: high
    alert_fr: "Lithium + TSH élevée : hypothyroïdie probable induite par le lithium, bilan thyroïdien complet"
  - id: lithium_calcium_high
    treatment_flag: on_lithium
    lab_names: ["Calcium", "Calcémie"]
    direction: high
    alert_fr: "Lithium + calcémie élevée : risque d'hyperparathyroïdie, dosage PTH recommandé"
  - id: valproate_liver_high
    treatment_flag: on_valproate
    lab_names: ["ALT", "AST", "GGT", "ALAT", "ASAT"]
    direction: high
    alert_fr: "Valproate + {liver_name} élevé : risque d'hépatotoxicité, surveillance hépatique renforcée"
    stop_after_first_match: true
  - id: valproate_platelets_low
    treatment_flag: on_valproate
    lab_names: ["Plaquettes", "Platelets"]
    direction: low
    alert_fr: "Valproate + thrombopénie : risque de thrombocytopénie induite, contrôle NFS"
  - id: clozapine_wbc_critical
    treatment_flag: on_clozapine
    lab_names: ["Leucocytes", "WBC"]
    absolute_threshold: {max: 3.5}
    alert_fr: "Clozapine + leucopénie : ALERTE agranulocytose, arrêt immédiat si GB < 3000 ou PNN < 1500"
  - id: clozapine_wbc_low
    treatment_flag: on_clozapine
    lab_names: ["Leucocytes", "WBC"]
    direction: low
    alert_fr: "Clozapine + leucocytes bas : surveillance NFS hebdomadaire renforcée"
  - id: antipsychotic_prolactin_high
    treatment_flags_any: [on_antipsychotic, on_clozapine]
    lab_names: ["Prolactine", "Prolactin"]
    direction: high
    alert_fr: "Antipsychotique + hyperprolactinémie : évaluer signes cliniques (galactorrhée, aménorrhée, ostéoporose)"

# ─── Cognitive normative tables ─────────────────────────────────────────────

cognitive_norms:
  tmt:
    source: "Tombaugh 2004"
    by_decade:
      20: {TMT-A: [29.5, 9.1],  TMT-B: [62.7,  21.4]}
      30: {TMT-A: [31.4, 9.8],  TMT-B: [68.7,  24.6]}
      40: {TMT-A: [33.2, 9.0],  TMT-B: [75.3,  25.8]}
      50: {TMT-A: [39.1, 12.4], TMT-B: [88.1,  32.1]}
      60: {TMT-A: [42.0, 15.2], TMT-B: [97.7,  38.4]}
      70: {TMT-A: [54.8, 21.1], TMT-B: [131.7, 54.9]}
  stroop:
    source: "Strauss 2006"
    by_decade:
      20: {Stroop_interference: [41.6, 9.3]}
      30: {Stroop_interference: [39.1, 9.5]}
      40: {Stroop_interference: [37.2, 9.8]}
      50: {Stroop_interference: [34.5, 10.2]}
      60: {Stroop_interference: [31.8, 10.5]}
      70: {Stroop_interference: [28.4, 11.2]}
  z_score_bands:
    - {max: -2.0, label_fr: "Performance très déficitaire"}
    - {max: -1.5, label_fr: "Performance déficitaire"}
    - {max: -1.0, label_fr: "Performance limite-basse"}
    - {max: 1.0,  label_fr: "Performance dans les limites normales"}
    - {max: null, label_fr: "Performance supérieure à la norme"}
