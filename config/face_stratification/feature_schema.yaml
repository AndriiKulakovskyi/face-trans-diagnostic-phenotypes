# Unified transdiagnostic V1 feature schema for face_stratification.
#
# Scope: baseline visit only. No longitudinal / follow-up / delta features.
# Loaded and validated by face_stratification.harmonization.feature_schema.
#
# Conventions
# -----------
# - Every feature declares the cohorts (bp / sz / dr / asp) that can provide it.
#   Cohorts that don't provide a feature emit NaN for the corresponding column.
# - `temporal_scope` is one of {current, lifetime, static}. `trajectory` is
#   banned by the loader — see feature_schema.py.
# - `direction` is used downstream by normalization to optionally flip sign.
# - Instrument totals are stored under `inst_<name>_total` where <name> is the
#   lowercased canonical instrument abbreviation with hyphens dropped.
# - Cohort-specific clinical flags are stored under `<domain>_<name>` — these
#   are single-cohort features that should remain NaN for other cohorts.

version: "0.2.0"

# ─── Data-driven transdiagnostic feature selection ───────────────────────────
# A feature joins the "transdiagnostic set" only if its observed-value coverage
# is at least `min_cohort_coverage` in every cohort. The pure transdiagnostic
# graph is built from this set with no imputation.
transdiagnostic_selection:
  min_cohort_coverage: 0.5            # must be measured for ≥50% of each cohort
  min_shared_features_fraction: 0.75  # pairs must share ≥75% of selected set
  metric: cosine
  excluded_feature_ids: []

# ─── Clinical blocks ─────────────────────────────────────────────────────────
#
# Each block's similarity graph enforces a semantic overlap edge constraint:
# - `min_fraction_present`: a patient needs at least this fraction of the
#   block's features measured to appear as a node in this block's graph.
# - `min_shared_features`: two candidate patients need to share at least this
#   many observed features to receive an edge. Omitted → defaults to half the
#   block at graph-build time.
#
# No values are ever imputed. A block never fabricates a distance from unseen
# measurements.
blocks:
  - id: demographics
    label_fr: "Données démographiques"
    description: "Âge, sexe, statut social, niveau d'études."
    metric: gower
    min_fraction_present: 0.6
    min_shared_features: 3

  - id: mood
    label_fr: "Symptômes thymiques"
    description: "Dépression, manie, hypomanie, global clinique."
    metric: cosine
    min_fraction_present: 0.5
    min_shared_features: 3

  - id: psychosis
    label_fr: "Symptômes psychotiques"
    description: "PANSS, Calgary, insight (SUMD), mouvements anormaux."
    metric: cosine
    min_fraction_present: 0.6   # aggressively excludes non-SZ patients
    min_shared_features: 3

  - id: anxiety_impulsivity
    label_fr: "Anxiété et impulsivité"
    description: "Anxiété (STAI, HAM-A, LSAS), impulsivité (BIS-10, BDHI)."
    metric: cosine
    min_fraction_present: 0.20  # DR has STAI+BIS-10 (2/8=25%); lowered to allow BP↔DR bridges
    min_shared_features: 2

  - id: functioning
    label_fr: "Fonctionnement et qualité de vie"
    description: "FAST, PSP, EQ-5D, EGF, LEAPS."
    metric: cosine
    min_fraction_present: 0.25  # each cohort uses different instruments (FAST, PSP, EGF, EQ-5D)
    min_shared_features: 1      # cross-cohort pairs share only 1 instrument (e.g. EQ-5D for BP↔SZ)

  - id: sleep_circadian
    label_fr: "Sommeil et rythme circadien"
    description: "PSQI, ESS, CSM (chronotype)."
    metric: cosine
    min_fraction_present: 0.5
    min_shared_features: 2

  - id: cognition
    label_fr: "Profil cognitif"
    description: "TMT, Stroop, fluences, empan, WAIS, BRIEF."
    metric: euclidean
    min_fraction_present: 0.15  # SZ has CVLT+fluency (3/17=18%); lowered to allow SZ↔BP bridges
    min_shared_features: 2      # SZ↔BP share CVLT+fluency; lowered from 5 for cross-cohort edges

  - id: biology
    label_fr: "Panel biologique"
    description: "IMC, vitales, glycémie, lipides, transaminases."
    metric: euclidean
    min_fraction_present: 0.5
    min_shared_features: 5

  - id: treatment
    label_fr: "Traitements actuels"
    description: "Classes médicamenteuses et adhésion (MARS)."
    metric: cosine
    min_fraction_present: 0.5
    min_shared_features: 3

  - id: substance
    label_fr: "Consommations"
    description: "Tabac, alcool, cannabis, autres substances."
    metric: gower
    min_fraction_present: 0.6
    min_shared_features: 3

  - id: trauma
    label_fr: "Antécédents traumatiques"
    description: "CTQ (enfance), PCL-5 (TSPT)."
    metric: cosine
    min_fraction_present: 0.5
    min_shared_features: 1

  - id: family_history
    label_fr: "Antécédents familiaux"
    description: "Psychiatrie / suicide / addictions chez apparentés."
    metric: gower
    min_fraction_present: 0.5
    min_shared_features: 2

  - id: comorbidities
    label_fr: "Comorbidités"
    description: "Comorbidités somatiques et psychiatriques (nombre)."
    metric: gower
    min_fraction_present: 0.5
    min_shared_features: 2

  - id: suicide_history
    label_fr: "Conduites suicidaires"
    description: "Idéation, plans, tentatives, violence des moyens."
    metric: gower
    min_fraction_present: 0.5
    min_shared_features: 2

  - id: psychiatric_history
    label_fr: "Histoire de la maladie"
    description: "Âge de début, durée, nombre d'épisodes, hospitalisations."
    metric: cosine
    min_fraction_present: 0.5
    min_shared_features: 2

  - id: insight
    label_fr: "Insight et conscience morbide"
    description: "SUMD — conscience de la maladie, des symptômes et du traitement (SZ)."
    metric: cosine
    min_fraction_present: 0.30  # SZ has 4/10 items at 93% + 6 newly fixed items at 93%; lowered from 0.6
    min_shared_features: 3

  - id: autism_profile
    label_fr: "Profil autistique"
    description: "ADI-R, ADOS, RBS-R, BRIEF, WAIS-IV, ADHD-RS, LSAS — phénotypage TSA."
    metric: cosine
    min_fraction_present: 0.3
    min_shared_features: 3

  - id: hostility_aggression
    label_fr: "Hostilité et agressivité"
    description: "BDHI — dimensions d'hostilité et d'agressivité (BP)."
    metric: cosine
    min_fraction_present: 0.5
    min_shared_features: 3

  - id: treatment_resistance
    label_fr: "Résistance thérapeutique"
    description: "Staging de résistance, C-SSRS, estime de soi, réactivité émotionnelle (DR)."
    metric: cosine
    min_fraction_present: 0.5
    min_shared_features: 2

  - id: neuropsych
    label_fr: "Batterie neuropsychologique étendue"
    description: "WAIS-IV sous-tests, empans, CPT — évaluation cognitive détaillée."
    metric: euclidean
    min_fraction_present: 0.10  # SZ has WAIS matrices only (1/10=10%); lowered for SZ↔BP bridges
    min_shared_features: 1      # SZ↔BP share WAIS matrices; lowered from 4 for cross-cohort edges

  - id: personality
    label_fr: "Traits de personnalité"
    description: "Big Five (BFI) — dimensions de personnalité."
    metric: cosine
    min_fraction_present: 0.40  # DR has 5/5 BFI at ~66%; lowered from 0.5 after fixing suspect_value
    min_shared_features: 3


