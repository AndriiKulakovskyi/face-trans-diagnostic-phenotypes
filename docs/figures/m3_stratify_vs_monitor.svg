<svg xmlns="http://www.w3.org/2000/svg" width="680" height="398" viewBox="0 0 680 398" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" role="img">
<title>Which axes to stratify on versus monitor</title>
<desc>Two columns: durable trait axes to stratify on (cognition, metabolic, inflammatory) and dynamic state axes to monitor (severity, suicidality, sleep), plus a row of caveated axes reported descriptively only (developmental, mania, substance).</desc>
<rect width="680" height="398" fill="#ffffff"/>
<rect x="60" y="52" width="250" height="36" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="185" y="75" text-anchor="middle" font-size="14" font-weight="500" fill="#085041">stratify on — durable (trait)</text>
<rect x="370" y="52" width="250" height="36" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
<text x="495" y="75" text-anchor="middle" font-size="14" font-weight="500" fill="#712B13">monitor — dynamic (state)</text>
<rect x="60" y="100" width="250" height="46" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="72" y="122" font-size="14" font-weight="500" fill="#085041">cognition</text><text x="72" y="139" font-size="12" fill="#0F6E56">ICC 0.78 · invariant</text>
<rect x="60" y="154" width="250" height="46" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="72" y="176" font-size="14" font-weight="500" fill="#085041">metabolic</text><text x="72" y="193" font-size="12" fill="#0F6E56">ICC 0.93 · invariant</text>
<rect x="60" y="208" width="250" height="46" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="72" y="230" font-size="14" font-weight="500" fill="#085041">inflammatory</text><text x="72" y="247" font-size="12" fill="#0F6E56">ICC 0.85 · partial-invariant</text>
<rect x="370" y="100" width="250" height="46" rx="6" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
<text x="382" y="122" font-size="14" font-weight="500" fill="#712B13">severity — the spine</text><text x="382" y="139" font-size="12" fill="#993C1D">trait-by-rank, slides −0.34</text>
<rect x="370" y="154" width="250" height="46" rx="6" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
<text x="382" y="176" font-size="14" font-weight="500" fill="#712B13">suicidality</text><text x="382" y="193" font-size="12" fill="#993C1D">slides −0.89 · not-tested</text>
<rect x="370" y="208" width="250" height="46" rx="6" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
<text x="382" y="230" font-size="14" font-weight="500" fill="#712B13">sleep</text><text x="382" y="247" font-size="12" fill="#993C1D">ICC 0.49 · mixed</text>
<text x="340" y="288" text-anchor="middle" font-size="14" font-weight="500" fill="#2C2C2A">descriptive only — not stratify-grade</text>
<rect x="60" y="300" width="178" height="46" rx="6" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="72" y="322" font-size="14" font-weight="500" fill="#2C2C2A">developmental</text><text x="72" y="339" font-size="12" fill="#5F5E5A">= CTQ recall noise</text>
<rect x="248" y="300" width="178" height="46" rx="6" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="260" y="322" font-size="14" font-weight="500" fill="#2C2C2A">mania</text><text x="260" y="339" font-size="12" fill="#5F5E5A">thin · 2 indicators</text>
<rect x="436" y="300" width="178" height="46" rx="6" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="448" y="322" font-size="14" font-weight="500" fill="#2C2C2A">substance</text><text x="448" y="339" font-size="12" fill="#5F5E5A">signal ≪ noise</text>
<text x="340" y="375" text-anchor="middle" font-size="12" fill="#5F5E5A">two routes (G3 variance · G4 geometry) agree on this split</text>
</svg>
