<svg xmlns="http://www.w3.org/2000/svg" width="680" height="398" viewBox="0 0 680 398" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" role="img">
<title>The M3 pipeline and how its gates condition the headlines</title>
<desc>The inventory feeds the substrate, which the G6 attrition honesty gate conditions and the G1 invariance gate licenses; the substrate feeds the G3 trait-state and G4 spine-versus-corner headlines, which combine into the synthesis and consolidation.</desc>
