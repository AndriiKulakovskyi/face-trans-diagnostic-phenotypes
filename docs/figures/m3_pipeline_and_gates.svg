<rect width="680" height="398" fill="#ffffff"/>
<rect x="250" y="56" width="180" height="44" rx="6" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="340" y="78" text-anchor="middle" font-size="14" font-weight="500" fill="#2C2C2A">M3.0 inventory</text><text x="340" y="93" text-anchor="middle" font-size="12" fill="#5F5E5A">what's there</text>
<line x1="340" y1="100" x2="340" y2="134" stroke="#888780" stroke-width="1" marker-end="url(#ph)"/>
<rect x="58" y="136" width="160" height="44" rx="6" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
<text x="138" y="158" text-anchor="middle" font-size="14" font-weight="500" fill="#712B13">G6 attrition</text><text x="138" y="173" text-anchor="middle" font-size="12" fill="#993C1D">honesty gate</text>
<line x1="218" y1="158" x2="248" y2="158" stroke="#888780" stroke-width="1" marker-end="url(#ph)"/>
<rect x="250" y="136" width="180" height="44" rx="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
<text x="340" y="158" text-anchor="middle" font-size="14" font-weight="500" fill="#0C447C">G2 substrate</text><text x="340" y="173" text-anchor="middle" font-size="12" fill="#185FA5">the V0–V2 panel</text>
<rect x="462" y="136" width="160" height="44" rx="6" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/>
<text x="542" y="158" text-anchor="middle" font-size="14" font-weight="500" fill="#633806">G1 invariance</text><text x="542" y="173" text-anchor="middle" font-size="12" fill="#854F0B">license gate</text>
<line x1="462" y1="158" x2="432" y2="158" stroke="#888780" stroke-width="1" marker-end="url(#ph)"/>
<line x1="305" y1="180" x2="240" y2="222" stroke="#888780" stroke-width="1" marker-end="url(#ph)"/>
<line x1="375" y1="180" x2="440" y2="222" stroke="#888780" stroke-width="1" marker-end="url(#ph)"/>
<rect x="120" y="224" width="190" height="48" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="215" y="246" text-anchor="middle" font-size="14" font-weight="500" fill="#085041">G3 trait/state</text><text x="215" y="262" text-anchor="middle" font-size="12" fill="#0F6E56">variance route</text>
<rect x="370" y="224" width="190" height="48" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="465" y="246" text-anchor="middle" font-size="14" font-weight="500" fill="#085041">G4 spine-vs-corner</text><text x="465" y="262" text-anchor="middle" font-size="12" fill="#0F6E56">geometry route</text>
<line x1="215" y1="272" x2="300" y2="312" stroke="#888780" stroke-width="1" marker-end="url(#ph)"/>
<line x1="465" y1="272" x2="380" y2="312" stroke="#888780" stroke-width="1" marker-end="url(#ph)"/>
<rect x="245" y="314" width="190" height="46" rx="6" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="340" y="336" text-anchor="middle" font-size="14" font-weight="500" fill="#2C2C2A">synthesis → M3.7</text><text x="340" y="351" text-anchor="middle" font-size="12" fill="#5F5E5A">the two routes agree</text>
