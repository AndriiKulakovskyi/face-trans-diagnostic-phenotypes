<svg xmlns="http://www.w3.org/2000/svg" width="680" height="432" viewBox="0 0 680 432" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" role="img">
<title>Temporal coherence: severity slides while biology corners persist</title>
<desc>Three patient tracks on a plane whose vertical axis is general severity (the spine) and horizontal axis is biological corner (the trait). Over V0, V1, V2 each patient slides downward in severity while keeping the same horizontal corner position.</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="680" height="432" fill="#ffffff"/>
<text x="160" y="60" text-anchor="middle" font-size="14" font-weight="500" fill="#2C2C2A">severity (G) — the spine</text>
<line x1="160" y1="348" x2="160" y2="78" stroke="#888780" stroke-width="1" marker-end="url(#ah)"/>
<line x1="160" y1="110" x2="622" y2="110" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="3 3"/>
<line x1="160" y1="200" x2="622" y2="200" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="3 3"/>
<line x1="160" y1="290" x2="622" y2="290" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="3 3"/>
<text x="150" y="114" text-anchor="end" font-size="12" fill="#5F5E5A">V0</text>
<text x="150" y="204" text-anchor="end" font-size="12" fill="#5F5E5A">V1</text>
<text x="150" y="294" text-anchor="end" font-size="12" fill="#5F5E5A">V2</text>
<line x1="160" y1="348" x2="628" y2="348" stroke="#888780" stroke-width="1" marker-end="url(#ah)"/>
<text x="392" y="382" text-anchor="middle" font-size="14" font-weight="500" fill="#2C2C2A">biology corner (phenotype) — the trait (held)</text>
<line x1="270" y1="118" x2="270" y2="284" stroke="#1D9E75" stroke-width="2.5"/>
<circle cx="270" cy="110" r="7" fill="#1D9E75"/><circle cx="270" cy="200" r="7" fill="#1D9E75"/><circle cx="270" cy="290" r="7" fill="#1D9E75"/>
<text x="270" y="322" text-anchor="middle" font-size="12" fill="#5F5E5A">metabolic</text>
<line x1="400" y1="118" x2="400" y2="284" stroke="#378ADD" stroke-width="2.5"/>
<circle cx="400" cy="110" r="7" fill="#378ADD"/><circle cx="400" cy="200" r="7" fill="#378ADD"/><circle cx="400" cy="290" r="7" fill="#378ADD"/>
<text x="400" y="322" text-anchor="middle" font-size="12" fill="#5F5E5A">cognition</text>
<line x1="530" y1="118" x2="530" y2="284" stroke="#D85A30" stroke-width="2.5"/>
<circle cx="530" cy="110" r="7" fill="#D85A30"/><circle cx="530" cy="200" r="7" fill="#D85A30"/><circle cx="530" cy="290" r="7" fill="#D85A30"/>
<text x="530" y="322" text-anchor="middle" font-size="12" fill="#5F5E5A">inflammatory</text>
<text x="392" y="412" text-anchor="middle" font-size="12" fill="#5F5E5A">each vertical track = one patient across V0 → V1 → V2</text>
</svg>
